    - search "Site search":
      - text: Search assets
      - searchbox "Search assets"
- main:
  - heading "Improve impact" [level=1]
  - paragraph: What akm's improve processes proposed, what was kept, who decided, and what it cost.
  - region "Did improve help search?":
    - heading "Did improve help search?" [level=2]
    - paragraph: /The share of your searches that returned something, over a rolling 7 days and the last \d+ days\. An amber line marks a day when improve changes were kept\. It measures retrieval, not whether answers were right\./
    - paragraph: /\d+% of searches found something, down 3 points since \d+-\d+-\d+ \(\d+%\)\./
    - paragraph: Searches that found something Improve changes kept
    - img /Share of searches that found something, rolling 7 days, over the last \d+ days, with 2 days marked when improve changes were kept\. Weekly figures follow in Data and details\./:
      - img: /Found something \d+% \d+% \d+% \d+% \d+% \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - group: Data and details
  - region /Last \d+ days/:
    - heading /Last \d+ days/ [level=2]
    - text: /Changes kept 6 1 by the judge · 5 by you Rejected 3 \d+% of decisions Reverted 1 accepted, then undone Waiting for review \d+/
    - link "Open the queue":
      - /url: "#/proposals"
    - text: /Model calls \d+ [\d,.]+[bkmBKM]+ \d+[hmsp]+ of call time/
  - heading "Decisions per week" [level=2]
  - paragraph: Every decided proposal by the week it was decided (UTC, weeks start Monday). The current week is still in progress.
  - paragraph: Accepted by the judge Accepted by you Rejected Reverted
  - img /Decided proposals per week for the last \d+ weeks, stacked by outcome\. Exact counts follow in Data and details\./:
    - img: /Decisions 0 1 2 3 4 5 \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
  - group: Data and details
  - heading "Reverted changes" [level=2]
  - paragraph: "Accepted changes that were later undone. Each one is worth a look: it may point at a process or judge setting to tighten."
  - list:
    - listitem:
      - link "stash//knowledge/deploy-guide":
        - /url: "#/proposals/p-reverted"
      - text: reverted distill · 9d ago
  - region "By process":
    - heading "By process" [level=2]
    - paragraph: /Outcomes over the last \d+ decided proposals\. "Kept rate" needs at least 5 decisions\./
    - group "Table":
      - table:
        - rowgroup:
          - row "Process Accepted by judge Rejected Reverted Waiting Kept rate Model calls (30d) Call time (30d)":
            - columnheader "Process"
            - columnheader "Accepted"
            - columnheader "by judge"
            - columnheader "Rejected"
            - columnheader "Reverted"
            - columnheader "Waiting"
            - columnheader "Kept rate"
            - columnheader "Model calls (30d)"
            - columnheader "Call time (30d)"
        - rowgroup:
          - row "consolidate-pair 3 0 0 0 1 n/a – –":
            - rowheader "consolidate-pair"
            - cell "3"
            - cell "0"
            - cell "0"
            - cell "0"
            - cell "1"
            - cell "n/a"
            - cell "–"
            - cell "–"
          - row /reflect 1 1 2 0 4 n\/a \d+ [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
            - rowheader "reflect"
            - cell "1"
            - cell "1"
            - cell "2"
            - cell "0"
            - cell "4"
            - cell "n/a"
            - cell /\d+/
            - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
          - row "consolidate 1 0 0 0 1 n/a – –":
            - rowheader "consolidate"
            - cell "1"
            - cell "0"
            - cell "0"
            - cell "0"
            - cell "1"
            - cell "n/a"
            - cell "–"
            - cell "–"
          - row "distill 1 0 0 1 2 n/a – –":
            - rowheader "distill"
            - cell "1"
            - cell "0"
            - cell "0"
            - cell "1"
            - cell "2"
            - cell "n/a"
            - cell "–"
            - cell "–"
          - row "extract 0 0 1 0 1 n/a – –":
            - rowheader "extract"
            - cell "0"
            - cell "0"
            - cell "1"
            - cell "0"
            - cell "1"
            - cell "n/a"
            - cell "–"
            - cell "–"
          - row "feedback 0 0 0 0 1 n/a – –":
            - rowheader "feedback"
            - cell "0"
            - cell "0"
            - cell "0"
            - cell "0"
            - cell "1"
            - cell "n/a"
            - cell "–"
            - cell "–"
  - heading "Recent changes to your library" [level=2]
  - paragraph: The latest accepted proposals. Open one to see its diff and the reason it was made.
  - list:
    - listitem:
      - link "stash//knowledge/deploy-guide":
        - /url: "#/proposals/p-judge-accepted"
      - text: judge reflect · 2d ago
    - listitem:
      - link "stash//commands/release-notes":
        - /url: "#/proposals/p-you-accepted"
      - text: you distill · 2d ago
    - listitem:
      - link "stash//knowledge/old-runbook":
        - /url: "#/proposals/p-retired-old-runbook"
      - text: retired you consolidate-pair · 2d ago
    - listitem:
      - link "stash//knowledge/old-notes":
        - /url: "#/proposals/p-retired-old-notes"
      - text: retired you consolidate-pair · 2d ago
    - listitem:
      - link "stash//knowledge/stale-note":
        - /url: "#/proposals/p-retired-stale-note"
      - text: retired you consolidate-pair · 2d ago
    - listitem:
      - link "stash//lessons/rg":
        - /url: "#/proposals/p-staged-accepted"
      - text: you consolidate · 4d ago
  - heading "Improve runs" [level=2]
  - paragraph: The most recent runs, newest first.
  - group "Table":
    - table:
      - rowgroup:
        - row "Started Result Model calls Duration":
          - columnheader "Started"
          - columnheader "Result"
          - columnheader "Model calls"
          - columnheader "Duration"
      - rowgroup:
        - row /\d+[hmsp]+ ago finished 6 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell /\d+[hmsp]+ ago/
          - cell "finished"
          - cell "6"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /\d+[hmsp]+ ago finished 5 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell /\d+[hmsp]+ ago/
          - cell "finished"
          - cell "5"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /2d ago finished 8 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "2d ago"
          - cell "finished"
          - cell "8"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /3d ago finished 7 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "3d ago"
          - cell "finished"
          - cell "7"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /5d ago finished 5 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "5d ago"
          - cell "finished"
          - cell "5"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /6d ago finished 8 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "6d ago"
          - cell "finished"
          - cell "8"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /7d ago finished 7 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "7d ago"
          - cell "finished"
          - cell "7"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /8d ago finished 6 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "8d ago"
          - cell "finished"
          - cell "6"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /9d ago failed 5 \(3 failed\) [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "9d ago"
          - cell "failed"
          - cell "5 (3 failed)"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/
        - row /10d ago finished 8 [\d,.]+[bkmBKM]+ \d+[hmsp]+/:
          - cell "10d ago"
          - cell "finished"
          - cell "8"
          - cell /[\d,.]+[bkmBKM]+ \d+[hmsp]+/