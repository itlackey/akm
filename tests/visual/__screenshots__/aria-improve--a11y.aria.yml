- status
- main:
  - heading "Improve impact" [level=1]
  - paragraph: What akm's improve processes did in your environment. Times are UTC.
  - group "Window":
    - radio /\d+ days/ [checked]
    - text: /\d+ days/
    - radio "1 year"
    - text: 1 year
  - paragraph:
    - strong: /Last \d+ days:/
    - link "6 kept":
      - /url: "#/improve"
    - text: ·
    - link "1 reverted":
      - /url: "#/improve"
    - text: ·
    - link "1 flag after a change":
      - /url: "#/improve"
    - text: ·
    - link /[\d,.]+[bkmBKM]+ tokens \(\d+% of calls reported\)/:
      - /url: "#/improve"
  - group: How to read this page
  - navigation "On this page":
    - list:
      - listitem:
        - link "Search quality":
          - /url: "#/improve"
      - listitem:
        - link "Outcomes":
          - /url: "#/improve"
      - listitem:
        - link "Review flow":
          - /url: "#/improve"
      - listitem:
        - link "Library":
          - /url: "#/improve"
      - listitem:
        - link "Harm log (5)":
          - /url: "#/improve"
      - listitem:
        - link "Cost":
          - /url: "#/improve"
      - listitem:
        - link "Changed assets":
          - /url: "#/improve"
      - listitem:
        - link "Judge and you":
          - /url: "#/improve"
  - region "Did improve help search?":
    - heading "Did improve help search?" [level=2]
    - paragraph: /The share of your searches that returned something, over a rolling 7 days and the last \d+ days\. An amber line marks a day when improve changes were kept\. It measures retrieval, not whether answers were right\./
    - paragraph: /\d+% of searches found something, down 3 points since \d+-\d+-\d+ \(\d+%\)\./
    - paragraph: Searches that found something Improve changes kept
    - img /Share of searches that found something, rolling 7 days, over the last \d+ days, with 2 days marked when improve changes were kept\. Weekly figures follow in Data and details\./:
      - img: /Found something \d+% \d+% \d+% \d+% \d+% \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - group: Data and details
  - region "Who decided what":
    - heading "Who decided what" [level=2]
    - paragraph: Each process's decisions in this window, by who decided and what became of them.
    - paragraph: Accepted by the judge Accepted by you Accepted, decider not recorded Rejected Reverted
    - list "Decisions by process":
      - listitem: consolidate 1 of 1 kept accepted, decider not recorded 1
      - listitem: consolidate-pair 3 of 3 kept accepted, decider not recorded 3
      - listitem: distill 1 of 2 kept accepted, decider not recorded 1 · reverted 1
      - listitem: extract 0 of 1 kept rejected 1
      - listitem: reflect 1 of 3 kept accepted by the judge 1 · rejected 2
    - group: Data and details
  - region "Is review keeping up?":
    - heading "Is review keeping up?" [level=2]
    - paragraph: "This week: 6 made, 5 decided, 9 waiting at the end of it."
    - heading "Waiting for review, at the end of each week" [level=3]
    - img "Proposals waiting for review at the end of each week.":
      - img: /Waiting 2 4 6 8 \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - heading "Made and decided each week" [level=3]
    - paragraph: Made Decided
    - img "Proposals made and decided each week.":
      - img: /Proposals 0 5 \d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - group: Data and details
  - region "How has the library changed?":
    - heading "How has the library changed?" [level=2]
    - paragraph: The library size is recorded each time akm indexes.
    - paragraph: Two or more indexes in the window draw this line.
  - region "Harm log (5)":
    - heading "Harm log (5)" [level=2]
    - paragraph: Changes that were undone, rejections that were reopened, retirements with a risk flagged, and feedback that came after a change. Never collapsed.
    - list:
      - listitem:
        - text: Flag after a change
        - link "stash//knowledge/deploy-guide":
          - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
        - text: "negative feedback: The rollback link is wrong · 2d ago"
        - link "Proposal":
          - /url: "#/proposals/p-reverted"
      - listitem:
        - text: Retired with a risk flagged
        - link "stash//knowledge/stale-note":
          - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fstale-note"
        - text: retired with a continuity risk flagged · 2d ago
        - link "Proposal":
          - /url: "#/proposals/p-retired-stale-note"
      - listitem:
        - text: Retired with a risk flagged
        - link "stash//knowledge/old-notes":
          - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fold-notes"
        - text: retired with a continuity risk flagged · 2d ago
        - link "Proposal":
          - /url: "#/proposals/p-retired-old-notes"
      - listitem:
        - text: Retired with a risk flagged
        - link "stash//knowledge/old-runbook":
          - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fold-runbook"
        - text: retired with a continuity risk flagged · 2d ago
        - link "Proposal":
          - /url: "#/proposals/p-retired-old-runbook"
      - listitem:
        - text: Reverted
        - link "stash//knowledge/deploy-guide":
          - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
        - text: distill change undone · 9d ago
        - link "Proposal":
          - /url: "#/proposals/p-reverted"
  - region "What does improve cost?":
    - heading "What does improve cost?" [level=2]
    - paragraph: /\d+ model calls; tokens are reported for \d+ of them\. Tokens are not money\./
    - paragraph: reflect triage.judgment
    - img "Model calls per week by process.":
      - img: /Calls 0 5 \d+ \d+ \d+ \d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - group: Data and details
  - region "Changed assets, before and after":
    - heading "Changed assets, before and after" [level=2]
    - paragraph: /How often each changed asset was found and rated in the \d+ days before and after the change\. A change under \d+ days old is still filling, so its after side is partial\./
    - group "Table":
      - table:
        - rowgroup:
          - row "Asset Process Changed Found Negative After":
            - columnheader "Asset"
            - columnheader "Process"
            - columnheader "Changed"
            - columnheader "Found"
            - columnheader "Negative"
            - columnheader "After"
        - rowgroup:
          - row "stash//commands/release-notes distill 2d ago 5 → 0 0 → 0 2 days so far":
            - rowheader "stash//commands/release-notes":
              - link "stash//commands/release-notes":
                - /url: "#/asset?ref=stash%2F%2Fcommands%2Frelease-notes"
            - cell "distill"
            - cell "2d ago"
            - cell "5 → 0"
            - cell "0 → 0"
            - cell "2 days so far"
          - row "stash//knowledge/deploy-guide reflect 2d ago 4 → 1 0 → 1 2 days so far":
            - rowheader "stash//knowledge/deploy-guide":
              - link "stash//knowledge/deploy-guide":
                - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
            - cell "reflect"
            - cell "2d ago"
            - cell "4 → 1"
            - cell "0 → 1"
            - cell "2 days so far"
          - row "stash//lessons/rg consolidate 4d ago 4 → 1 0 → 1 4 days so far":
            - rowheader "stash//lessons/rg":
              - link "stash//lessons/rg":
                - /url: "#/asset?ref=stash%2F%2Flessons%2Frg"
            - cell "consolidate"
            - cell "4d ago"
            - cell "4 → 1"
            - cell "0 → 1"
            - cell "4 days so far"
          - row "stash//knowledge/deploy-guide distill 9d ago reverted 5 → 2 0 → 1 9 days so far":
            - rowheader "stash//knowledge/deploy-guide":
              - link "stash//knowledge/deploy-guide":
                - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
            - cell "distill"
            - cell "9d ago reverted"
            - cell "5 → 2"
            - cell "0 → 1"
            - cell "9 days so far"
  - region "Judge and you":
    - heading "Judge and you" [level=2]
    - paragraph: How the judge's decisions and yours compare.
    - group "Table":
      - table:
        - rowgroup:
          - row "Decided by Accepted Rejected Later reverted Kept":
            - columnheader "Decided by"
            - columnheader "Accepted"
            - columnheader "Rejected"
            - columnheader "Later reverted"
            - columnheader "Kept"
        - rowgroup:
          - row /The judge 1 0 0 \d+%/:
            - rowheader "The judge"
            - cell "1"
            - cell "0"
            - cell "0"
            - cell /\d+%/
          - row /Decider not recorded 5 3 1 \d+%/:
            - rowheader "Decider not recorded"
            - cell "5"
            - cell "3"
            - cell "1"
            - cell /\d+%/
