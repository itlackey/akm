- status
- main:
  - paragraph:
    - link "Search":
      - /url: "#/search"
    - text: / asset
  - heading "release-notes" [level=1]
  - paragraph:
    - button "Copy ref"
    - link "Document history":
      - /url: "#/asset?ref=stash%2F%2Fcommands%2Frelease-notes&history=1"
  - group: Suggest a fix
  - text: command stash editable
  - region "Content":
    - paragraph:
      - text: Draft release notes for
      - code: $ARGUMENTS
      - text: .
    - list:
      - listitem: List the pull requests merged since the last tag.
      - listitem: Group them under Added, Changed and Fixed.
      - listitem: Keep each line to one sentence.
  - group: Asset details
  - group: Markdown source
  - heading "Feedback" [level=2]
  - paragraph: 0 positive 0 negative
  - text: Feedback
  - combobox "Feedback":
    - option "Helpful" [selected]
    - option "Incorrect or stale"
  - text: Reason
  - textbox "Reason":
    - /placeholder: What helped, or what is wrong and should change
  - paragraph: A reason is required for negative feedback. A note that did not fit your task is not necessarily incorrect.
  - text: Tags
  - textbox "Tags":
    - /placeholder: Optional key:value tags, comma-separated (team:platform)
  - button "Send feedback"
  - paragraph: No feedback recorded for this asset.
  - complementary "About this asset":
    - term: Type
    - definition: command
    - term: Bundle
    - definition: stash
    - term: Feedback
    - definition: /\+0 \/ −0 \d+ days/
    - paragraph:
      - text: 1 pending proposal
      - link "Review →":
        - /url: "#/proposals/p-pending-consolidate"
    - heading "Improve history" [level=2]
    - img /Weekly finds and opens, last \d+ days/
    - paragraph: /Finds and opens per week, last \d+ days\./
    - list:
      - listitem:
        - text: unknown distill
        - link /2d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/:
          - /url: "#/proposals/p-you-accepted"
          - time: /2d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
      - listitem:
        - text: rejected reflect
        - link /6d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/:
          - /url: "#/proposals/p-you-rejected"
          - time: /6d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
- contentinfo:
  - text: akm 0.0.0 · visual-host bun
  - group "Theme":
    - radio "System" [checked]
    - text: System
    - radio "Light"
    - text: Light
    - radio "Dark"
    - text: Dark