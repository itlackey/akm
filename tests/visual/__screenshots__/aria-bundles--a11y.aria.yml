- status
- main:
  - heading "Bundles & index" [level=1]
  - paragraph:
    - text: Where akm reads assets from and where new ones are written. Set the default bundle and write target in
    - link "Config":
      - /url: "#/config"
    - text: .
  - paragraph: Default bundle stash; writes go to stash.
  - region "Configured bundles":
    - heading "Configured bundles" [level=2]
    - paragraph: Every source akm indexes, with its git state and what it holds.
    - article:
      - heading "stash" [level=3]
      - text: filesystem default writable
      - paragraph:
        - link "Browse assets":
          - /url: "#/search?bundle=stash"
      - term: Path
      - definition: /tmp/akm-visual-loaded/stash
      - term: Source
      - definition: this folder
      - term: Assets
      - definition: "6"
      - img "knowledge 3, command 1, lesson 1, memory 1"
      - paragraph: knowledge 3 command 1 lesson 1 memory 1
      - heading "Git" [level=4]
      - term: Branch
      - definition: main
      - term: Remote
      - definition: no upstream
      - term: Uncommitted
      - definition: clean
      - term: Last commit
      - definition:
        - time: /\d+[hmsp]+ ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
        - text: 376a148b akm improve auto-sync
      - group: Bundle settings
      - paragraph:
        - button "Update / reindex bundle"
      - group: Remove bundle
  - region "Add a bundle":
    - heading "Add a bundle" [level=2]
    - paragraph: A local folder, Git repository, npm package or website. akm detects its format, validates it and indexes it. Adding a remote source uses the network.
    - text: Source
    - textbox "Source":
      - /placeholder: ./team-skills, github:org/repo, npm:package or a docs URL
    - button "Browse…"
    - paragraph: Type a folder, Git repository, npm package or docs URL, or browse for a folder on this computer.
    - text: Name
    - textbox "Name":
      - /placeholder: Optional; defaults to the source name
    - text: Allow writes to a Git source
    - paragraph: Local folders are writable by default. Git sources are read-only unless you allow writes.
    - switch "Allow writes to a Git source"
    - button "Add bundle"
  - region "Index":
    - heading "Index" [level=2]
    - paragraph: The search index across every enabled bundle.
    - term: Entries
    - definition: "6"
    - term: Last built
    - definition:
      - time: /\d+[hmsp]+ ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
    - term: Embeddings
    - definition: none
    - term: Semantic search
    - definition: off disabled
    - img "knowledge 3, command 1, lesson 1, memory 1"
    - paragraph: knowledge 3 command 1 lesson 1 memory 1
