- navigation "Main":
  - link "akm ui":
    - /url: "#/overview"
  - list:
    - listitem:
      - link "Overview":
        - /url: "#/overview"
    - listitem:
      - link /Proposals \d+/:
        - /url: "#/proposals"
    - listitem:
      - link "Improve impact":
        - /url: "#/improve"
    - listitem:
      - link "History":
        - /url: "#/changes"
    - listitem:
      - link "Search":
        - /url: "#/search"
    - listitem:
      - link "New knowledge":
        - /url: "#/new"
    - listitem:
      - link "Bundles":
        - /url: "#/bundles"
    - listitem:
      - link "Config":
        - /url: "#/config"
  - button "Refresh view"
  - text: akm 0.0.0 · visual-host bun
- main:
  - heading "Overview" [level=1]
  - paragraph: How your akm environment is doing, and what needs you.
  - text: Window
  - combobox "Window":
    - option /Last \d+ hours/
    - option "Last 7 days"
    - option /Last \d+ days/ [selected]
  - text: Overall health warn 0 failing 1 warning 5 unknown 9 passing akm 0.0.0 window since
  - time: /\d+[hmsp]+ ago/
  - region "Needs attention":
    - heading "Needs attention" [level=2]
    - list:
      - listitem:
        - link "1 health warning":
          - /url: "#/overview"
      - listitem:
        - link /\d+ proposals waiting for review oldest 20d ago/:
          - /url: "#/proposals"
      - listitem:
        - link "1 failed task run":
          - /url: "#/overview"
      - listitem:
        - link /\d+ searches found nothing add knowledge for them/:
          - /url: "#/search"
  - region "Improve":
    - heading "Improve" [level=2]
    - paragraph:
      - text: "/Last improve run \\d+[hmsp]+ ago: finished, 6 model calls, [\\d,.]+[bkmBKM]+ \\d+[hmsp]+\\./"
      - link "See what improve changed":
        - /url: "#/improve"
  - region "At a glance":
    - heading "At a glance" [level=2]
    - link /Searches \d+ \d+% found nothing/:
      - /url: "#/search"
    - link /Waiting for review \d+ proposals/:
      - /url: "#/proposals"
    - link /Model calls \d+ \d+,\d+ tokens/:
      - /url: "#/improve"
    - text: /Task runs 2 1 failed Feedback \+4 \/ −2 positive \/ negative Median search \d+ ms \d+ assets opened/
  - region "Trends":
    - heading "Trends" [level=2]
    - paragraph: /Your activity in UTC days\. Health covers the last \d+ hours\./
    - heading "Activity" [level=2]
    - checkbox "Search" [checked]
    - text: Search
    - checkbox "Curate" [checked]
    - text: Curate
    - checkbox "Show" [checked]
    - text: Show
    - checkbox "Feedback" [checked]
    - text: Feedback
    - img "Recorded operations by UTC day. Choose series above; exact counts follow in Data and details.":
      - img: /Operations 0 3 6 9 \d+ \d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+/
    - group: Data and details
    - heading "Model utilization" [level=2]
    - text: Group by
    - combobox "Group by":
      - option "Process" [selected]
      - option "Execution target"
    - text: Measure
    - combobox "Measure":
      - option "Calls" [selected]
      - option "Tokens"
      - option "Time"
    - img "Model utilization ranked by the chosen measure. Select a bar or its table button for counts and coverage.":
      - img: /Calls reflect triage\.judgment 0 \d+ \d+ \d+ \d+ \d+ \d+/
    - paragraph: /Tokens cover \d+ \/ \d+ calls, not monetary cost\. Time is summed call duration, not elapsed job time\./
    - group: Data and details
    - heading "Retrieval health" [level=2]
    - paragraph: All searches No results
    - img "Total searches and no-result searches by UTC day. Select a day to inspect unsuccessful queries.":
      - img: /Searches 0 3 6 9 \d+ \d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+/
    - heading "Median search latency" [level=3]
    - img "Median recorded search latency by UTC day on its own millisecond scale. Missing samples are gaps.":
      - img: /Milliseconds 0 \d+ \d+ \d+ \d+ \d+ \d+ \d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+/
    - paragraph: No-result counts describe retrieval, not answer quality. Missing latency samples are unknown.
    - group: Data and details
    - heading "Automation reliability" [level=2]
    - img "Failed task runs ranked by failures before any display limit. Exact recorded-run denominators and history are in the table.":
      - img: Failures nightly-improve 0 0.2 0.4 0.6 0.8 1
    - paragraph: Failures first. Other recorded statuses are not automatically successes; missing runs do not prove a schedule ran.
    - group: Task data and history
    - group: /Recent improve runs · latest \d+, all time/
  - group: Measurement coverage
  - heading "Health checks" [level=2]
  - group:
    - text: Warnings 1
    - list:
      - listitem:
        - strong: active-runs
        - text: deterministic, high confidence
        - paragraph: "/1 active task run\\(s\\) are older than \\d+ minutes: hourly-sync \\([\\d,.]+[bkmBKM]+\\)\\./"
        - group: Evidence
  - group: Unknown 5
  - group: Passing 9