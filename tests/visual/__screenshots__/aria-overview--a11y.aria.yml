- status
- main:
  - heading "Overview" [level=1]
  - paragraph: Your akm environment. Times are UTC.
  - text: /Overall health warn last \d+ hours 0 failing 1 warning 5 unknown 9 passing window since/
  - time: /\d+[hmsp]+ ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
  - region "Needs attention":
    - heading "Needs attention" [level=2]
    - list:
      - listitem:
        - link "1 run failed this week View runs →":
          - /url: "#/improve"
      - listitem:
        - link "1 health warning View →":
          - /url: "#/overview"
      - listitem:
        - link /\d+ proposals waiting, oldest 20d Review →/:
          - /url: "#/proposals"
      - listitem:
        - 'link "Set up: connect a model so improve can run Open Config →"':
          - /url: "#/config"
  - region "Last 7 days against your usual Last 7 days vs the 8 weeks before":
    - heading "Last 7 days against your usual Last 7 days vs the 8 weeks before" [level=2]
    - text: /Found nothing \d+% \d+ of \d+ searches\. Above your usual 0% to \d+%\./
    - img "Weekly trend"
    - text: "/Negative feedback 2 2 assets\\. Too few weeks of feedback for a usual range\\. Latest: stash\\/\\/knowledge\\/deploy-guide, 2d ago\\. Runs finishing 6 of 8 Improve 6 of 6 ok\\. Tasks 0 of 2 ok\\. Failed: nightly-improve, \\d+[hmsp]+ ago\\./"
    - paragraph:
      - text: "/Last 4 weeks: improve proposed \\d+; 7 accepted \\(1 since reverted\\), 2 rejected \\(0 by you\\), \\d+ waiting · \\d+ model calls/"
      - link "Improve impact →":
        - /url: "#/improve"
  - region /Trends Last \d+ days/:
    - heading /Trends Last \d+ days/ [level=2]
    - group "Trend window":
      - radio /\d+ days/ [checked]
      - text: /\d+ days/
      - radio /\d+ days/
      - text: /\d+ days/
    - paragraph: /\d+-\d+-\d+ \d+:\d+ to now, UTC\. Today is partial\. Health covers the last \d+ hours\./
    - heading /Is search finding what you need\? \d+ searches · \d+ found nothing/ [level=2]
    - paragraph: "/Unusual: the week of \\d+-\\d+-\\d+ \\(\\d+%\\) fell outside the usual range\\./"
    - paragraph: "Found nothing, by week Band: the usual range Improve run (below)"
    - img "Share of searches that found nothing, by week, with its usual range. Weekly figures follow in Data and details.":
      - img: /Found nothing 0% 5% \d+% \d+% \d+% \d+% \d+% \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - img "Improve runs by week, on the same weeks as the chart above.":
      - img
    - heading "Searches per week" [level=3]
    - img "Searches per week.":
      - img: /Searches 0 \d+ \d+ \d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - heading "Search time" [level=3]
    - img "Median search time by day. A gap means no timing was recorded that day.":
      - img: /Milliseconds 0 \d+ \d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+ \d+-\d+/
    - paragraph: Your own searches only. A day or week marked as partial is still filling. Found-nothing describes retrieval, not whether an answer was right.
    - group: Data and details
    - heading "Feedback and use" [level=2]
    - paragraph: "Your own activity only: searches, curates, shows and feedback you made."
    - checkbox "Search" [checked]
    - text: Search
    - checkbox "Curate" [checked]
    - text: Curate
    - checkbox "Show" [checked]
    - text: Show
    - checkbox "Feedback" [checked]
    - text: Feedback
    - img "Recorded operations by UTC day. Choose series above; exact counts follow in Data and details.":
      - img: /Operations 0 3 6 9 \d+ \d+ \d+-\d+-\d+\* \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+ \d+-\d+-\d+\*/
    - group: Data and details
    - heading "Model utilization" [level=2]
    - text: Group by
    - combobox "Group by":
      - option "Process" [selected]
      - option "Execution target"
    - text: Measure
    - combobox "Measure":
      - option "Calls" [selected]
      - option "Tokens"
      - option "Time"
    - img "Model utilization ranked by the chosen measure. Select a bar or its table button for counts and coverage.":
      - img: /Calls reflect triage\.judgment 0 \d+ \d+ \d+ \d+ \d+ \d+/
    - paragraph: "/Tokens cover \\d+ \\/ \\d+ calls, not monetary cost\\. Time is summed call duration, not elapsed job time\\. All sources: improve, tasks and agents\\./"
    - group: Data and details
    - heading "Automation reliability" [level=2]
    - paragraph: Scheduled task runs, ranked by failure rate. n is the number of recorded runs.
    - img "Failed task runs ranked by failures before any display limit. Exact recorded-run denominators and history are in the table.":
      - img: /Failure rate \(%\) nightly-improve \(n\.\.\. 0 \d+ \d+ \d+ \d+ \d+/
    - paragraph: Failures first. Other recorded statuses are not automatically successes; missing runs do not prove a schedule ran.
    - group: Task data and history
    - group: /Latest \d+ improve runs \(all time, not this window\)/
  - group: Measurement coverage
  - heading "Health checks" [level=2]
  - group:
    - text: Warnings 1
    - list:
      - listitem:
        - strong: active-runs
        - text: deterministic, high confidence
        - paragraph: "/1 active task run\\(s\\) are older than \\d+ minutes: hourly-sync \\([\\d,.]+[bkmBKM]+\\)\\./"
        - group: Evidence
  - group: Unknown 5
  - group: Passing 9
