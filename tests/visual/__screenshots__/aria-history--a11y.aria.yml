- status
- main:
  - heading "History" [level=1]
  - paragraph: Recent commits to stash (/tmp/akm-visual-loaded/stash). Times are in your time zone.
  - search "Filter commits":
    - text: ""
    - searchbox "Filter"
    - text: Made by
    - combobox "Made by":
      - option "Anything" [selected]
      - option "accept"
      - option "improve-sync"
      - option "sync"
    - button "Filter"
