  - paragraph
  - navigation "Breadcrumb":
    - link "Proposals":
      - /url: "#/proposals"
    - text: / stash//knowledge/rollback
  - heading "stash//knowledge/rollback" [level=2]
  - text: pending consolidate-pair retire
  - region "Decide this proposal":
    - paragraph: This proposal changes nothing
    - paragraph: The proposed content matches the asset as it is, so accepting would write nothing and record no commit. Rejecting it clears it from the queue.
    - paragraph:
      - button "Reject as no-op"
      - button "Accept anyway"
  - region "Why akm proposed this":
    - heading "Why akm proposed this" [level=2]
    - term: Process
    - definition: consolidate-pair
    - term: Source run
    - definition: /run-\d+/
    - term: Judge
    - definition: "deferred: judgment-deferred"
    - term: Confidence
    - definition: /\d+\.\d+/
    - term: Validation
    - definition: no findings
    - term: Waiting
    - definition:
      - time: /4d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
  - heading "Retirement" [level=2]
  - term: Retires
  - definition:
    - link "stash//knowledge/rollback":
      - /url: "#/asset?ref=stash%2F%2Fknowledge%2Frollback"
  - term: Successor
  - definition:
    - link "stash//knowledge/deploy-guide":
      - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
  - term: Reason
  - definition: subsumed
  - term: Judge
  - definition: subsumed The deploy guide now covers every rollback step.
  - term: Similarity
  - definition: /\d+\.\d+ cosine/
  - term: Only in retired
  - definition:
    - list:
      - listitem: Open an incident note after a rollback
  - term: Only in successor
  - definition: nothing
  - term: Continuity risk
  - definition:
    - text: flagged
    - group "Continuity risk, scrolls sideways": "{ \"failingQueries\": 2, \"ranks\": [ { \"query\": \"rollback steps\", \"retiredRank\": 1, \"successorRank\": null }, { \"query\": \"undo deploy\", \"retiredRank\": 3, \"successorRank\": null } ] }"
  - heading "Proposed change" [level=2]
  - paragraph: Target /tmp/akm-visual-loaded/stash/knowledge/rollback.md
  - text: "/--- stash\\/\\/knowledge\\/rollback \\(existing\\) \\+\\+\\+ \\/dev\\/null \\(retired: archived; successor stash\\/\\/knowledge\\/deploy-guide\\) @@ \\d+,\\d+ \\d+,\\d+ @@ ---- -description: Roll back a bad deploy ---- -# Rollback - -Redeploy the previous tag, then open an incident note\\./"
  - group: Proposal details
  - paragraph:
    - link "View the asset as it is now":
      - /url: "#/asset?ref=stash%2F%2Fknowledge%2Frollback"
