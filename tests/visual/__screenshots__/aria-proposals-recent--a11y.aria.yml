- main:
  - heading "Proposals" [level=1]
  - paragraph: Changes akm improve has staged for review.
  - navigation "Proposal lists":
    - link "Pending":
      - /url: "#/proposals"
    - link "Recent":
      - /url: "#/proposals?status=recent"
  - link /All \d+/:
    - /url: "#/proposals?status=recent"
  - link "consolidate 1":
    - /url: "#/proposals?status=recent&source=consolidate"
  - link "consolidate-pair 3":
    - /url: "#/proposals?status=recent&source=consolidate-pair"
  - link "distill 2":
    - /url: "#/proposals?status=recent&source=distill"
  - link "extract 1":
    - /url: "#/proposals?status=recent&source=extract"
  - link "reflect 3":
    - /url: "#/proposals?status=recent&source=reflect"
  - table:
    - rowgroup:
      - row "Decided Outcome Source Asset Reason":
        - columnheader "Decided"
        - columnheader "Outcome"
        - columnheader "Source"
        - columnheader "Asset"
        - columnheader "Reason"
    - rowgroup:
      - row "2d ago accepted reflect stash//knowledge/deploy-guide judgment-accept":
        - cell "2d ago":
          - time: 2d ago
        - cell "accepted"
        - cell "reflect"
        - cell "stash//knowledge/deploy-guide":
          - link "stash//knowledge/deploy-guide":
            - /url: "#/proposals/p-judge-accepted?status=recent"
        - cell "judgment-accept"
      - row "2d ago accepted distill stash//commands/release-notes Good catch":
