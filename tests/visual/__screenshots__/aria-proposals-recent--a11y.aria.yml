          - time: 2d ago
        - cell "accepted"
        - cell "distill"
        - cell "stash//commands/release-notes":
          - link "stash//commands/release-notes":
            - /url: "#/proposals/p-you-accepted?status=recent"
        - cell "Good catch"
      - row "2d ago accepted consolidate-pair stash//knowledge/old-runbook retires in favour of stash//knowledge/deploy-guide -":
        - cell "2d ago":
          - time: 2d ago
        - cell "accepted"
        - cell "consolidate-pair"
        - cell "stash//knowledge/old-runbook retires in favour of stash//knowledge/deploy-guide":
          - link "stash//knowledge/old-runbook":
