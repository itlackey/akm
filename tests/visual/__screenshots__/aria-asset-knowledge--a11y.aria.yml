  - text: knowledge stash editable
  - group: On this page
  - region "Content":
    - heading "Deploy guide" [level=2]
    - paragraph:
      - text: Run the deploy script from the release branch. See
      - link "knowledge/rollback":
        - /url: "#/asset?ref=stash%2F%2Fknowledge%2Frollback"
        - code: knowledge/rollback
      - text: for the way back.
    - heading "Checklist" [level=3]
    - list:
      - listitem: Check that the build is green.
      - listitem:
        - text: Run
        - code: /\.\/deploy[\d,.]+[hmsp]+ --env prod/
        - text: .
      - listitem: Watch the dashboards for ten minutes.
  - group: Asset details
  - group: Markdown source
  - heading "Feedback" [level=2]
  - paragraph: 6 positive 1 negative
  - text: Feedback
  - combobox "Feedback":
    - option "Helpful" [selected]
    - option "Incorrect or stale"
  - text: Reason
  - textbox "Reason":
    - /placeholder: What helped, or what is wrong and should change
  - paragraph: A reason is required for negative feedback. A note that did not fit your task is not necessarily incorrect.
  - text: Tags
  - textbox "Tags":
    - /placeholder: Optional key:value tags, comma-separated (team:platform)
  - button "Send feedback"
  - group "Table":
