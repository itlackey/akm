- status: Deploy guide. Asset page loaded.
- main:
  - paragraph:
    - link "Search":
      - /url: "#/search"
    - text: / asset
  - heading "Deploy guide" [level=1]
  - paragraph:
    - link "Edit Markdown":
      - /url: "#/edit?ref=stash%2F%2Fknowledge%2Fdeploy-guide"
    - button "Helpful"
    - button "Not helpful"
    - button "Copy ref"
    - link "Document history":
      - /url: "#/asset?ref=stash%2F%2Fknowledge%2Fdeploy-guide&history=1"
    - text: ·
    - link "New knowledge":
      - /url: "#/new"
  - text: knowledge stash editable
  - group: On this page
  - region "Content":
    - paragraph:
      - text: Run the deploy script from the release branch. See
      - link "knowledge/rollback":
        - /url: "#/asset?ref=stash%2F%2Fknowledge%2Frollback"
        - code: knowledge/rollback
      - text: for the way back.
    - heading "Checklist" [level=3]
    - list:
      - listitem: Check that the build is green.
      - listitem:
        - text: Run
        - code: /\.\/deploy[\d,.]+[hmsp]+ --env prod/
        - text: .
      - listitem: Watch the dashboards for ten minutes.
  - group: Asset details
  - group: Markdown source
  - heading "Feedback" [level=2]
  - paragraph: 6 positive 1 negative
  - text: Feedback
  - combobox "Feedback":
    - option "Helpful" [selected]
    - option "Incorrect or stale"
  - text: Reason
  - textbox "Reason":
    - /placeholder: What helped, or what is wrong and should change
  - paragraph: A reason is required for negative feedback. A note that did not fit your task is not necessarily incorrect.
  - text: Tags
  - textbox "Tags":
    - /placeholder: Optional key:value tags, comma-separated (team:platform)
  - button "Send feedback"
  - group "Table":
    - table:
      - rowgroup:
        - row "When Signal Source Reason Tags":
          - columnheader "When"
          - columnheader "Signal"
          - columnheader "Source"
          - columnheader "Reason"
          - columnheader "Tags"
      - rowgroup:
        - row /2d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\) negative user The rollback link is wrong/:
          - cell /2d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/:
            - time: /2d ago \(6\/\d+\/\d+, 2:\d+:\d+ PM\)/
          - cell "negative"
          - cell "user"
          - cell "The rollback link is wrong"
          - cell
        - row /8d ago \(6\/9\/\d+, 2:\d+:\d+ PM\) positive user Clear and complete/:
