- banner:
  - navigation "Main":
    - link "akm ui":
      - /url: "#/overview"
    - list:
      - listitem:
        - link "Overview":
          - /url: "#/overview"
      - listitem:
        - link /Proposals \d+/:
          - /url: "#/proposals"
      - listitem:
        - link "Improve impact":
          - /url: "#/improve"
      - listitem:
        - link "History":
          - /url: "#/changes"
      - listitem:
        - link "Search":
          - /url: "#/search"
      - listitem:
        - link "New knowledge":
          - /url: "#/new"
      - listitem:
        - link "Bundles":
          - /url: "#/bundles"
      - listitem:
        - link "Config":
          - /url: "#/config"
    - search:
      - text: Search assets
      - searchbox "Search assets"
- main:
  - heading "Config" [level=1]
  - paragraph:
    - text: Settings for this install, saved to /tmp/akm-visual-loaded/config/config.json. Every change is validated like
    - code: akm config set
    - text: .
  - region "Search":
    - heading "Search" [level=2]
    - paragraph: How search finds and ranks your assets.
    - group "Semantic search set in config.json":
      - text: ""
      - paragraph: Auto uses embeddings when the index has them, and keyword search otherwise.
      - radiogroup:
        - radio "Off" [checked]
        - text: "Off"
        - radio "Auto"
        - text: Auto
    - text: Hide these types by default
    - textbox "Hide these types by default":
      - /placeholder: memory, script
    - paragraph: Comma-separated asset types that search leaves out unless you ask for them.
    - text: Rerank curate results
    - paragraph: Send the top candidates to a reranker model before curate picks.
    - switch "Rerank curate results"
    - text: Reranker endpoint
    - textbox "Reranker endpoint":
      - /placeholder: host:port/rerank
    - text: Candidates to rerank
    - spinbutton "Candidates to rerank"
    - paragraph: /At most \d+\./
    - button "Save changes" [disabled]
  - region "Library":
    - heading "Library" [level=2]
    - paragraph: Where akm reads by default and where it writes new assets.
    - text: Default bundle set in config.json
    - combobox "Default bundle":
      - option "Automatic (working stash)"
      - option "stash" [selected]
    - text: Default write target set in config.json
    - combobox "Default write target":
      - option "Automatic (working stash)"
      - option "stash" [selected]
    - paragraph: New knowledge, memories and accepted proposals are written here.
    - text: Keep archived assets for
    - spinbutton "Keep archived assets for"
    - paragraph: Days before retired assets are purged from the archive.
    - text: Require a reason with feedback
    - paragraph: Negative feedback always needs a reason; this asks for one on positive feedback too.
    - switch "Require a reason with feedback"
    - button "Save changes" [disabled]
  - region "Command output":
    - heading "Command output" [level=2]
    - paragraph: The defaults the akm CLI uses when you pass no --format or --detail.
    - text: Format default
    - combobox "Format":
      - option "json" [selected]
      - option "yaml"
      - option "text"
      - option "jsonl"
      - option "md"
      - option "html"
    - group "Detail default":
      - text: ""
      - radiogroup:
        - radio "Brief" [checked]
        - text: Brief
        - radio "Normal"
        - text: Normal
        - radio "Full"
        - text: Full
    - button "Save changes" [disabled]
  - region "Model connections":
    - heading "Model connections" [level=2]
    - paragraph: The OpenAI-compatible endpoints improve, judges and agents call. Keys are environment variable references.
    - paragraph: No connections yet.
    - paragraph: Add one to let improve and the judges call a model.
    - group: Add a connection
  - region "Advanced":
    - heading "Advanced" [level=2]
    - paragraph:
      - text: Set or unset any key, as
      - code: akm config set
      - text: does. Objects and lists take JSON.
    - text: Key
    - textbox "Key":
      - /placeholder: improve.processes.reflect.enabled
    - text: Value
    - textbox "Value":
      - /placeholder: "true"
    - switch "Unset this key instead"
    - text: Unset this key instead
    - button "Apply"
    - group: Effective config (read-only, secrets redacted)
    - group: Environment (8 AKM_* variables)