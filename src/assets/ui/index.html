<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>akm ui</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/overview">akm <span>ui</span></a>
      <button type="button" class="menu-toggle btn-secondary" data-menu aria-expanded="false" aria-controls="nav-links">Menu</button>
      <ul class="nav-links" id="nav-links">
        <li><a data-route="overview" href="#/overview">Overview</a></li>
        <li class="nav-group" aria-hidden="true">Review</li>
        <li><a data-route="proposals" href="#/proposals">Proposals <span class="nav-count" data-pending-count hidden></span></a></li>
        <li><a data-route="improve" href="#/improve">Improve impact</a></li>
        <li><a data-route="changes" href="#/changes">History</a></li>
        <li class="nav-group" aria-hidden="true">Library</li>
        <li><a data-route="search" href="#/search">Search</a></li>
        <li><a data-route="new" href="#/new">New knowledge</a></li>
        <li class="nav-group" aria-hidden="true">Setup</li>
        <li><a data-route="bundles" href="#/bundles">Bundles</a></li>
        <li><a data-route="config" href="#/config">Config</a></li>
      </ul>
      <button type="button" class="btn-secondary" data-refresh>Refresh view</button>
      <div class="nav-meta" id="nav-meta"></div>
    </nav>
    <div id="unsaved" class="notice notice-warn" role="alert" hidden></div>
    <main id="app" aria-live="polite">
      <noscript><p>akm ui needs JavaScript. It makes no network requests beyond its own local server.</p></noscript>
    </main>
  </div>
</body>
</html>
