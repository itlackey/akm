name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in package.json: 0.10 and later 0.<minor>.YYMMNN, the UTC year and month then the release number in that month (for example 0.10.261001; bun scripts/release-version.ts next prints the next free one), earlier lines X.Y.Z."
        required: true
        type: string
      stage:
        description: "Stage of this release: alpha, beta or rc publishes <version>-<stage> to the npm next tag; none publishes <version> to latest. Every release takes its own number. 0.10 and later only."
        required: false
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  # The semantic, Docker and native-scheduler gates, run on this commit.
  gated:
    uses: ./.github/workflows/gated-ci.yml

  release:
    needs: gated
    runs-on: ubuntu-latest
    # tests/release-check.sh proves the packaged artifact; the build and
    # publish steps follow it.
    timeout-minutes: 30
    environment: release
    env:
      VERSION_INPUT: ${{ inputs.version }}
      STAGE_INPUT: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # scripts/release-version.ts validates the format (0.10+:
      # 0.<minor>.YYMMNN; older lines: X.Y.Z[-prerelease]) and appends the
      # stage input to the version (#1089). package.json must carry the
      # version input, as before; a stage is stamped into this run's
      # package.json. Each release takes its own number: a build is not
      # promoted through stages.
      - name: Verify version
        run: |
          CANDIDATE_VERSION="$(bun scripts/release-version.ts resolve)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION_INPUT" ]; then
            echo "package.json is $PACKAGE_VERSION, not $VERSION_INPUT"
            exit 1
          fi
          if [ "$CANDIDATE_VERSION" != "$VERSION_INPUT" ]; then
            npm pkg set version="$CANDIDATE_VERSION"
          fi
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Releasing akm-cli@$CANDIDATE_VERSION"

      # tests/release-check.sh proves the packaged artifact: npm bin targets,
      # the akm-migrate bundle under Bun and Node, and package acceptance. Docker
      # runs in the gated job above; the upgrade rehearsal runs in CI.
      - name: Release check
        run: ./tests/release-check.sh --skip-docker

      - name: Build package and binaries
        run: |
          cp .github/README.npm.md README.md
          bun run build
          mkdir artifacts
          while read -r target output; do
            bun scripts/build-standalone.ts \
              --target "$target" \
              --outfile "artifacts/$output" \
              --version "$CANDIDATE_VERSION"
          done <<'EOF'
          bun-linux-x64 akm-linux-x64
          bun-linux-arm64 akm-linux-arm64
          bun-darwin-x64 akm-darwin-x64
          bun-darwin-arm64 akm-darwin-arm64
          bun-windows-x64 akm-windows-x64.exe
          EOF
          cp install.sh install.ps1 artifacts/
          # Pack BEFORE checksumming. The tarball is uploaded to the GitHub
          # release by the `artifacts/akm-*` glob below, so computing checksums
          # first left one published asset that checksums.txt did not cover —
          # silently unverifiable for anyone checking the release by hand. The
          # existing `akm-*` glob already matches akm-cli-<version>.tgz, so
          # ordering is the whole fix; adding *.tgz would checksum it twice.
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum akm-* install.sh install.ps1 > checksums.txt)

      - run: npm install -g npm@latest

      - name: Configure npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Lint, typecheck, the unit and integration suites and the upgrade
      # rehearsal run in CI on this exact commit; wait for that run rather than
      # running them again here, so Release can be dispatched right after the
      # release commit is pushed. The newest push or manual CI run on the commit
      # decides: a pull_request run tests a merge with its base branch, and on a
      # draft skips the upgrade rehearsal. It passes at once when that run
      # already passed, and fails when it failed or was cancelled, or has not
      # passed in 25 minutes (50 polls, 30 seconds apart).
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 50); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json event,status,conclusion --jq '.[] | .event + " " + .status + " " + .conclusion')"
            run="$(awk 'NF && $1 != "pull_request" { print $2 " " $3; exit }' <<<"$runs")"
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*)
                echo "CI did not pass on $GITHUB_SHA: $run" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "CI has not passed on $GITHUB_SHA within 25 minutes; last status: ${run:-no push or manual CI run yet}" >&2
          exit 1

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "akm-cli@$CANDIDATE_VERSION" version >/dev/null 2>&1; then
            echo "akm-cli@$CANDIDATE_VERSION is already published"
            exit 0
          fi
          if [[ "$CANDIDATE_VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish "./artifacts/akm-cli-$CANDIDATE_VERSION.tgz" \
            --ignore-scripts \
            --provenance \
            --access public \
            --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$CANDIDATE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/akm-* artifacts/install.sh artifacts/install.ps1 artifacts/checksums.txt --clobber
            exit 0
          fi
          PRERELEASE=()
          if [[ "$CANDIDATE_VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${PRERELEASE[@]}" \
            artifacts/akm-* \
            artifacts/install.sh \
            artifacts/install.ps1 \
            artifacts/checksums.txt
