name: Release

# A stable release is the merge of a release branch into main. The push runs the integration suite (with the Node
# fallback smoke and the upgrade rehearsals), Desktop's tests and Gated CI on the merged commit, then publishes the
# version committed in package.json to npm `latest` and a GitHub release, and builds Desktop and akm-web from that
# tarball. The pull request that merged it ran CI, so CI does not run again.
# A prerelease is a dispatch on a release branch, release/<version>, with a stage: CI, the integration suite (with
# the Node fallback smoke and the upgrade rehearsals), Desktop's tests and Gated CI run as jobs of this run on the
# commit, then <version>-<stage>.N goes to npm `next` and a GitHub prerelease, N counting up from 1. The integration
# suite, Desktop's tests and Gated CI run nowhere else: every release passes them here.
# docs/maintainers/release-checklist.md describes the branch model.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Prerelease stage: publishes the release branch's version with the stage and the next counter appended (release/<version> publishes <version>-<stage>.1, then .2) to the npm next tag and a GitHub prerelease. A stable release is the merge of a release branch into main, not a dispatch."
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - rc
      dry_run:
        description: "Run everything except the gates, the npm publish and the GitHub release: builds the package, the binaries and Desktop on all three platforms, and keeps the files as workflow artifacts. Never tags or publishes."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  # The gates. A dry run proves nothing about the packaging by running them. CI runs for a prerelease only: the merge
  # that makes a stable passed it on its pull request. The integration suite (node-smoke and upgrade-rehearsal
  # included), Desktop's tests and Gated CI run for both.
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    uses: ./.github/workflows/ci.yml

  # The integration suite (scripts/test-integration.sh: duration-balanced shards, each killed at 900s), set up the
  # way CI's `check` job is.
  integration:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
        env:
          # Keeps the shards' logs and junit reports, uploaded below.
          TEST_INTEGRATION_LOGDIR: ${{ runner.temp }}/akm-integration-shards
      # Every run, green or not: the per-file times regenerate tests/integration/.timings.json
      # (docs/architecture/testing/testing-workflow.md), and a red run's full shard logs show where it failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: integration-shards
          path: ${{ runner.temp }}/akm-integration-shards/shard-*
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  # The Node fallback on both supported Node versions: the smoke drives the built CLI under Node, then the node-compat
  # and workspace-package integration tests.
  node-smoke:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Installs the SPEC THE PACKAGE DECLARES, read back out of package.json so
      # the two cannot drift — this job exists to prove the binding npm users
      # actually get works. Why it is pinned: package.json → pinNotes
      # ["better-sqlite3@13.0.3"]. scripts/node-smoke.ts preflights that what
      # landed is that exact version and that it loads under this node.
      - name: Verify the Node fallback
        run: |
          spec=$(node -p "require('./package.json').optionalDependencies['better-sqlite3']")
          # `bun install` leaves it out (Bun tries to build it and drops the optional
          # dependency when that fails), so npm installs it here.
          npm install --no-save "better-sqlite3@$spec"
          bun run test:node-smoke
          bun run test:node-compat
          bun run test:workspace-package
        env:
          AKM_SMOKE_NODE: node

  # The candidate installed over a home that an origin release built (tests/integration/upgrade-rehearsal/), two
  # origin-release installs per job.
  upgrade-rehearsal:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One job per KNOWN_UPGRADE_ORIGINS entry (tests/integration/upgrade-rehearsal/previous-release.ts).
      matrix:
        origin: [previous, "0.9.32", "0.9.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: AKM_UPGRADE_REHEARSAL=1 AKM_UPGRADE_REHEARSAL_ORIGIN="${{ matrix.origin }}" TMPDIR=/tmp bun test --timeout=900000 tests/integration/upgrade-rehearsal/

  # Desktop's tests (type check, unit, browser, usability, server, package and Electron), on Linux. Pull requests run
  # only Desktop's check and build. `test:workspace-package` stays in node-smoke.
  desktop-tests:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          # Latest 22.x: Desktop needs 22.18 or later (its tests load TypeScript through Node's type stripping).
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Cache the Electron and Playwright downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/ms-playwright
          key: desktop-downloads-${{ runner.os }}-${{ hashFiles('desktop/bun.lock') }}
      - name: Build repository-backed Desktop
        run: bun run desktop:setup
      - name: Verify Desktop workflows
        working-directory: desktop
        run: |
          node node_modules/electron/install.js
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run check
          npm run build
          npm test
          npm run test:e2e
          npm run test:usability
      - name: Verify the web process runs without Electron
        working-directory: desktop
        run: npm run test:server
      - name: Verify the akm-web package installs and runs
        working-directory: desktop
        run: npm run test:web-package
      - name: Verify the Electron shell
        working-directory: desktop
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:electron

  gated:
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/gated-ci.yml

  release:
    needs: [ci, integration, node-smoke, upgrade-rehearsal, desktop-tests, gated]
    # The gates passed, or did not run (CI for a stable; every gate for a dry run). A failed or cancelled gate stops
    # here.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
    # tests/release-check.sh proves the packaged artifact; the build and
    # publish steps follow it.
    timeout-minutes: 30
    environment: release
    env:
      # Empty on a push to main: a stable release of the committed version.
      STAGE_INPUT: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # A release's version is its branch name, release/<version>. A stable (the push to main) publishes the version
      # committed in package.json, which the pull request's release-branch-only check matched to the branch; a
      # prerelease (a dispatch on the release branch) publishes the branch's version with the stage and the next
      # counter appended (one above the highest on npm for that release and stage), stamped into this run's
      # package.json only. scripts/release-version.ts validates the format (0.10+: 0.<minor>.YYMMNN; older lines:
      # X.Y.Z[-prerelease]) and appends the stage (#1089).
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$GITHUB_REF_NAME" in
              release/*) VERSION_INPUT="${GITHUB_REF_NAME#release/}" ;;
              *)
                echo "A prerelease is dispatched on a release branch (release/<version>); this is $GITHUB_REF_NAME" >&2
                exit 1
                ;;
            esac
          else
            VERSION_INPUT="$(node -p "require('./package.json').version")"
          fi
          export VERSION_INPUT
          CANDIDATE_VERSION="$(bun scripts/release-version.ts resolve)"
          if [ "$CANDIDATE_VERSION" != "$VERSION_INPUT" ]; then
            npm pkg set version="$CANDIDATE_VERSION"
          fi
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing akm-cli@$CANDIDATE_VERSION"

      # tests/release-check.sh proves the packaged artifact: npm bin targets,
      # the akm-migrate bundle under Bun and Node, and package acceptance. Docker
      # runs in Gated CI; the upgrade rehearsal in the upgrade-rehearsal job.
      - name: Release check
        run: ./tests/release-check.sh --skip-docker

      - name: Build package and binaries
        run: |
          cp .github/README.npm.md README.md
          bun run build
          mkdir artifacts
          while read -r target output; do
            bun scripts/build-standalone.ts \
              --target "$target" \
              --outfile "artifacts/$output" \
              --version "$CANDIDATE_VERSION"
          done <<'EOF'
          bun-linux-x64 akm-linux-x64
          bun-linux-arm64 akm-linux-arm64
          bun-darwin-x64 akm-darwin-x64
          bun-darwin-arm64 akm-darwin-arm64
          bun-windows-x64 akm-windows-x64.exe
          EOF
          cp install.sh install.ps1 artifacts/
          # A release's installers install that release: pin their default from "latest" to this tag.
          sed -i "s|^TAG=\"latest\"$|TAG=\"v$CANDIDATE_VERSION\"|" artifacts/install.sh
          sed -i "s|else { \"latest\" }|else { \"v$CANDIDATE_VERSION\" }|" artifacts/install.ps1
          grep -q "v$CANDIDATE_VERSION" artifacts/install.sh
          grep -q "v$CANDIDATE_VERSION" artifacts/install.ps1
          # Pack BEFORE checksumming. The tarball is uploaded to the GitHub
          # release by the `artifacts/akm-*` glob below, so computing checksums
          # first left one published asset that checksums.txt did not cover —
          # silently unverifiable for anyone checking the release by hand. The
          # existing `akm-*` glob already matches akm-cli-<version>.tgz, so
          # ordering is the whole fix; adding *.tgz would checksum it twice.
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum akm-* install.sh install.ps1 > checksums.txt)

      # Desktop embeds exactly this tarball: the file npm publishes below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: akm-cli
          path: artifacts/akm-cli-*.tgz
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - run: npm install -g npm@latest

      - name: Configure npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A stable release is `latest`. A prerelease is `next` only when it is higher than the prerelease `next` points
      # at; one from an older line published after a newer line's gets its line's tag (`next-0.10`), so `next` never
      # moves backwards. akm-web publishes under the same tag.
      - name: Choose the npm dist-tag
        id: dist-tag
        run: |
          if [[ "$CANDIDATE_VERSION" != *-* ]]; then
            DIST_TAG=latest
          elif current="$(npm view akm-cli dist-tags.next 2>/dev/null)" && [ -n "$current" ] \
            && ! node -e 'process.exit(require("semver").gt(process.argv[1], process.argv[2]) ? 0 : 1)' "$CANDIDATE_VERSION" "$current"; then
            DIST_TAG="next-$(cut -d. -f1,2 <<<"$CANDIDATE_VERSION")"
          else
            DIST_TAG=next
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "npm dist-tag: $DIST_TAG"

      # npm trusted publishing: the job's OIDC token (id-token: write) authenticates; no npm token is stored.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          if npm view "akm-cli@$CANDIDATE_VERSION" version >/dev/null 2>&1; then
            echo "akm-cli@$CANDIDATE_VERSION is already published"
            exit 0
          fi
          npm publish "./artifacts/akm-cli-$CANDIDATE_VERSION.tgz" \
            --ignore-scripts \
            --provenance \
            --access public \
            --tag "$DIST_TAG"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$CANDIDATE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/akm-* artifacts/install.sh artifacts/install.ps1 artifacts/checksums.txt --clobber
            exit 0
          fi
          # GitHub makes every newly published stable release Latest, whatever its version, and AKM Desktop's stable
          # line reads Latest: an older line's stable published after a newer line's leaves Latest where it is.
          FLAGS=()
          if [[ "$CANDIDATE_VERSION" == *-* ]]; then
            FLAGS=(--prerelease)
          elif latest="$(gh release view --json tagName --jq .tagName 2>/dev/null)" && [ -n "$latest" ] \
            && ! node -e 'process.exit(require("semver").gt(process.argv[1], process.argv[2]) ? 0 : 1)' "$CANDIDATE_VERSION" "${latest#v}"; then
            FLAGS=(--latest=false)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${FLAGS[@]}" \
            artifacts/akm-* \
            artifacts/install.sh \
            artifacts/install.ps1 \
            artifacts/checksums.txt

  # Desktop X embeds released akm X: one version, one release. It is built from the tarball the release job just
  # packed (published above on a real release), on each platform, and attached to the same GitHub release. The
  # installers are unsigned (desktop/docs/software.md). A dry run keeps the files as workflow artifacts instead.
  desktop:
    needs: release
    # A skipped job anywhere upstream would skip this one without this condition.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    # Only the release upload needs write access; no npm provenance here.
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24

      # Outside the checkout, so the tree stays clean for the release guard.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: akm-cli
          path: ${{ runner.temp }}/engine

      - name: Build and start Desktop
        run: |
          cd desktop
          node scripts/core.mjs --tarball "$RUNNER_TEMP/engine/akm-cli-$VERSION.tgz"
          bun install --frozen-lockfile --ignore-scripts --force
          npm run build
          node scripts/package.mjs --release
          node scripts/smoke.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/dist/*
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Attach Desktop to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" desktop/dist/* --clobber

  # The web process alone, for servers and containers (`akm-web`). Independent of the Desktop installers: nothing needs
  # this job and it needs only `release`, so its failure is visible but never blocks the installer uploads. A dry run
  # builds the package and publishes nothing.
  akm-web:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DIST_TAG: ${{ needs.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Outside the checkout, so the tree stays clean for the release guard.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: akm-cli
          path: ${{ runner.temp }}/engine

      - name: Build the akm-web package
        run: |
          cd desktop
          node scripts/core.mjs --tarball "$RUNNER_TEMP/engine/akm-cli-$VERSION.tgz"
          bun install --frozen-lockfile --ignore-scripts --force
          npm run build
          # Two commands: a failure inside $(...) would not stop the step.
          node scripts/package-web.mjs --release > "$RUNNER_TEMP/akm-web.json"
          echo "STAGE=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").pop()).stage' "$RUNNER_TEMP/akm-web.json")" >> "$GITHUB_ENV"

      # npm trusted publishing, as for akm-cli: the job's OIDC token authenticates; no npm token is stored.
      - name: Publish akm-web to npm
        if: ${{ !inputs.dry_run }}
        run: |
          NAME=$(node -p 'require(process.argv[1]).name' "$STAGE/package.json")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
            exit 0
          fi
          npm publish "$STAGE" --ignore-scripts --provenance --access public --tag "$DIST_TAG"
