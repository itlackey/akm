name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in package.json: 0.10 and later 0.<minor>.YYMMDDNN (for example 0.10.26101001; bun scripts/release-version.ts next prints the next free one), earlier lines X.Y.Z."
        required: true
        type: string
      stage:
        description: "Prerelease stage of the build, published to the npm next tag. none publishes the build itself to latest. Daily builds only."
        required: false
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # tests/release-check.sh replaced the old `bun run check` step with the
    # full release-acceptance suite (build, package/install regression, the
    # published-upgrade tests under Node and Bun, and a Linux standalone
    # build/run) on top of everything `check` already covered, plus this
    # job's own artifact build/publish steps after it. 20 minutes was already
    # this job's whole budget for `check` + build + publish; give the larger
    # gate room without being unbounded.
    timeout-minutes: 45
    environment: release
    env:
      VERSION_INPUT: ${{ inputs.version }}
      STAGE_INPUT: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.sha }}
          # Full history — release-check.sh runs lint, and the golden pin gate
          # judges nothing in a shallow clone (#795).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # scripts/release-version.ts validates the format (0.10+:
      # 0.<minor>.YYMMDDNN; older lines: X.Y.Z[-prerelease]) and appends the
      # stage input to a daily build (#1089). package.json must carry the
      # version input, as before; a stage is stamped into this run's
      # package.json so one committed build can be published as -alpha, -beta,
      # -rc and then as itself.
      - name: Verify version
        run: |
          CANDIDATE_VERSION="$(bun scripts/release-version.ts resolve)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION_INPUT" ]; then
            echo "package.json is $PACKAGE_VERSION, not $VERSION_INPUT"
            exit 1
          fi
          if [ "$CANDIDATE_VERSION" != "$VERSION_INPUT" ]; then
            npm pkg set version="$CANDIDATE_VERSION"
          fi
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Releasing akm-cli@$CANDIDATE_VERSION"

      # Publish gate: tests/release-check.sh — the same script the runbook
      # directs operators to run locally before triggering this workflow — is
      # the actual release-acceptance suite. It supersedes the old `bun run
      # check` step (it runs verify-only lint, typecheck, and both the unit
      # and integration suites itself) and additionally proves the *packaged*
      # artifact: npm bin targets/launcher selection, the akm-migrate bundle
      # under both Bun and Node, package/install/setup regression, and the
      # published 0.8 -> candidate task upgrade under both runtimes. Docker is
      # skipped here because the exact candidate's separate Gated CI run is a
      # required, linked release-checklist artifact; duplicating its Docker and
      # native-platform work inside the publishing job would add cost without
      # improving candidate identity.
      - name: Release check
        run: ./tests/release-check.sh --skip-docker

      - name: Build package and binaries
        run: |
          cp .github/README.npm.md README.md
          bun run build
          mkdir artifacts
          while read -r target output; do
            bun build ./scripts/akm-standalone.ts \
              --compile \
              --target="$target" \
              --outfile "artifacts/$output" \
              --define "AKM_VERSION='$CANDIDATE_VERSION'"
          done <<'EOF'
          bun-linux-x64 akm-linux-x64
          bun-linux-arm64 akm-linux-arm64
          bun-darwin-x64 akm-darwin-x64
          bun-darwin-arm64 akm-darwin-arm64
          bun-windows-x64 akm-windows-x64.exe
          EOF
          cp install.sh install.ps1 artifacts/
          # Pack BEFORE checksumming. The tarball is uploaded to the GitHub
          # release by the `artifacts/akm-*` glob below, so computing checksums
          # first left one published asset that checksums.txt did not cover —
          # silently unverifiable for anyone checking the release by hand. The
          # existing `akm-*` glob already matches akm-cli-<version>.tgz, so
          # ordering is the whole fix; adding *.tgz would checksum it twice.
          npm pack --ignore-scripts --pack-destination artifacts
          (cd artifacts && sha256sum akm-* install.sh install.ps1 > checksums.txt)

      - run: npm install -g npm@latest

      - name: Configure npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "akm-cli@$CANDIDATE_VERSION" version >/dev/null 2>&1; then
            echo "akm-cli@$CANDIDATE_VERSION is already published"
            exit 0
          fi
          if [[ "$CANDIDATE_VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish "./artifacts/akm-cli-$CANDIDATE_VERSION.tgz" \
            --ignore-scripts \
            --provenance \
            --access public \
            --tag "$DIST_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$CANDIDATE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/akm-* artifacts/install.sh artifacts/install.ps1 artifacts/checksums.txt --clobber
            exit 0
          fi
          PRERELEASE=()
          if [[ "$CANDIDATE_VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${PRERELEASE[@]}" \
            artifacts/akm-* \
            artifacts/install.sh \
            artifacts/install.ps1 \
            artifacts/checksums.txt
