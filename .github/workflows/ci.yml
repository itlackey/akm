name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/CHANGELOG.md"
      - "CLAUDE.md"
      - "LICENSE"
  pull_request:
    branches: [main, "release/*"]
    # ready_for_review: marking a draft ready runs the full gate at once (see the jobs' draft conditions).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/CHANGELOG.md"
      - "CLAUDE.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        # Full history: scripts/lint-golden-captured-at-head.ts resolves recorded
        # `capturedAtHead` commits, and under the default fetch-depth: 1 none of
        # them exist in the clone — the gate then takes its own "inconclusive"
        # branch for EVERY pin and reports OK having judged nothing (#795).
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  desktop:
    # Desktop has its own job. A ready pull request and every push run it; a draft pull request runs it only when a path
    # Desktop depends on changes. `test:workspace-package` stays in node-smoke, the cheap check on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - name: Decide whether Desktop runs
        id: scope
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$DRAFT" = "true" ] && ! git diff --name-only "$BASE"...HEAD | grep -qE '^(desktop/|src/workspace|src/commands/ui/|scripts/node-runtime/workspace|\.github/workflows/ci\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Build repository-backed Desktop
        if: steps.scope.outputs.run == 'true'
        run: bun run desktop:setup
      - name: Verify Desktop workflows
        if: steps.scope.outputs.run == 'true'
        working-directory: desktop
        run: |
          node node_modules/electron/install.js
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          npm run check
          npm run build
          npm test
          npm run test:e2e
          npm run test:usability
      - name: Verify the Electron shell
        if: steps.scope.outputs.run == 'true'
        working-directory: desktop
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:electron

  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A draft pull request runs the oldest supported Node only; a ready pull request and a push run both.
        node-version: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Installs the SPEC THE PACKAGE DECLARES, read back out of package.json so
      # the two cannot drift — this job exists to prove the binding npm users
      # actually get works. Why it is pinned: package.json → pinNotes
      # ["better-sqlite3@13.0.3"]. scripts/node-smoke.ts preflights that what
      # landed is that exact version and that it loads under this node.
      - name: Verify the Node fallback
        run: |
          spec=$(node -p "require('./package.json').optionalDependencies['better-sqlite3']")
          # `bun install` leaves it out (Bun tries to build it and drops the optional
          # dependency when that fails), so npm installs it here.
          npm install --no-save "better-sqlite3@$spec"
          bun run test:node-smoke
          bun run test:node-compat
          bun run test:workspace-package
        env:
          AKM_SMOKE_NODE: node

  upgrade-rehearsal:
    # Two origin-release installs per job. The gate before a merge: a ready pull request and every push run it;
    # a draft pull request, where commits land many times a day, does not.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One job per KNOWN_UPGRADE_ORIGINS entry (tests/integration/upgrade-rehearsal/previous-release.ts).
      matrix:
        origin: [previous, "0.9.32", "0.9.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: AKM_UPGRADE_REHEARSAL=1 AKM_UPGRADE_REHEARSAL_ORIGIN="${{ matrix.origin }}" TMPDIR=/tmp bun test --timeout=900000 tests/integration/upgrade-rehearsal/
