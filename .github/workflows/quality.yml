name: Quality

# On demand only: never runs on push or pull request. The static measures always run (seconds); coverage and compare
# run when their input is set. Reports are uploaded as the `quality-reports` artifact. Nothing here gates a merge.
# How to read each number: docs/architecture/testing/testing-workflow.md ("Quality Measures").
on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Run the whole suite once with coverage
        type: boolean
        default: false
      compare_base:
        description: Compare this ref with the dispatched ref (static measures); empty skips compare
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run quality:complexity
      - run: bun run quality:duplication
      - run: bun run quality:dead-code
      - if: ${{ inputs.coverage }}
        run: bun run quality:coverage
      - if: ${{ inputs.compare_base != '' }}
        env:
          COMPARE_BASE: ${{ inputs.compare_base }}
        run: bun run quality:compare -- "$COMPARE_BASE"
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-reports
          path: reports/quality
          if-no-files-found: ignore
