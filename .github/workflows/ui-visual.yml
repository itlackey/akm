name: ui-visual

# Pixel checks of the akm ui. Separate from ci.yml and not a required check. Baselines are
# only valid from the pinned image below: bump the image, @playwright/test (package.json
# pinNotes), the test:ui-visual:docker script and the baselines together. The paths keep
# a PR that touches no UI from pulling the 3.5 GB image.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/assets/ui/**"
      - "src/commands/ui/**"
      - "src/commands/metrics/**"
      - "tests/visual/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ui-visual.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      # The image has Node 24; same install as the docker script, since setup-bun needs unzip, which the image lacks.
      - run: npm install -g --allow-scripts=bun bun@1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:ui-visual
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: ui-visual-report
          path: .ui-visual/report
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: ui-visual-actual
          path: .ui-visual/test-results
          if-no-files-found: ignore
