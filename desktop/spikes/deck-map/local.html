<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local graph spike</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage">
      <div id="deck"></div>
      <section class="panel" aria-label="Graph controls">
        <h1>Local graph <span class="muted">deck.gl spike</span></h1>
        <p id="counts" class="muted">Loading…</p>
        <label class="field">Find an asset <input id="find" type="search" placeholder="path or title" autocomplete="off" /></label>
        <ul id="results" class="results"></ul>
        <p class="muted">Try:</p>
        <div id="examples" class="examples"></div>
        <label><input id="similar" type="checkbox" checked /> Show similar assets (dashed)</label>
        <label><input id="three" type="checkbox" checked /> 3D</label>
        <label><input id="spin" type="checkbox" checked /> Rotate when idle</label>
        <button id="reset" type="button">Back to one step</button>
        <ul class="legend key">
          <li><svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" stroke="currentColor" stroke-width="1.5" /></svg>Declared link</li>
          <li><svg width="28" height="8" aria-hidden="true"><line x1="0" y1="4" x2="28" y2="4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" /></svg>Similar, not linked</li>
          <li><svg width="28" height="12" aria-hidden="true"><circle cx="14" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>Has links not shown (+N): click to expand</li>
        </ul>
        <ul id="legend" class="legend"></ul>
      </section>
      <aside id="detail" class="panel detail" hidden></aside>
    </main>
    <script type="module" src="/src/local.js"></script>
  </body>
</html>
