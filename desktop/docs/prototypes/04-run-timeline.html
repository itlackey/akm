<body>
<header class="topbar">
  <span class="brand">akm</span>
  <nav aria-label="Sections"><span>Home</span><span>Library</span><span>Projects</span><span>Review</span><span aria-current="page">Activity</span><span>Settings</span></nav>
  <span class="proto">Prototype · synthetic data</span>
  <button id="theme"></button>
</header>
<div class="subbar">
  <h1>Run timeline</h1>
  <span class="muted small">Every scheduled task, workflow run, improve run and index build on one clock</span>
  <span class="grow"></span>
  <span class="key">
    <span><i style="background:var(--muted)"></i>Completed</span>
    <span><i style="background:var(--fail)"></i>✕ Failed</span>
    <span><i style="background:var(--warn);transform:rotate(45deg) scale(.8)"></i>Blocked</span>

  </span>
  <span class="seg" id="range"><button data-v="1" aria-pressed="false">24 hours</button><button data-v="3" aria-pressed="false">3 days</button><button data-v="14" aria-pressed="true">14 days</button></span>
</div>
<main>
  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="Timeline of runs over the last 14 days. Scroll to zoom, drag to move through time. The panel on the right lists failures as text."></canvas>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="side" id="side"></aside>
</main>
<script>
// Prototype helpers shared by the examples.
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
/** A seeded random source, so every load shows the same data. */
function rng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.int = (n) => Math.floor(next() * n);
  next.pick = (list) => list[Math.floor(next() * list.length)];
  next.gauss = () => (next() + next() + next() + next() - 2) * 0.87;
  return next;
}
/** The colour a design token resolves to in the scheme on screen, as [r, g, b] (the same probe chart-view.js uses). */
function tokenRGB(name) {
  const probe = el("span", { style: `position:absolute;visibility:hidden;color:var(${name})` });
  document.body.append(probe);
  const c = document.createElement("canvas").getContext("2d");
  c.fillStyle = getComputedStyle(probe).color;
  c.fillRect(0, 0, 1, 1);
  probe.remove();
  return [...c.getImageData(0, 0, 1, 1).data.slice(0, 3)];
}
const isDark = () => {
  const forced = document.documentElement.dataset.theme;
  return forced ? forced === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
/** The Appearance switch: Desktop stores this choice; here it only stamps data-theme. */
function themeToggle(button, onChange) {
  const apply = () => { button.textContent = isDark() ? "Light theme" : "Dark theme"; onChange?.(isDark()); };
  button.addEventListener("click", () => {
    document.documentElement.dataset.theme = isDark() ? "light" : "dark";
    apply();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
  apply();
}
const fmt = (n) => n.toLocaleString("en-US");
const ago = (days) => (days < 1 ? "today" : days < 2 ? "yesterday" : days < 60 ? `${Math.round(days)} days ago` : `${Math.round(days / 30)} months ago`);


// Runs in the shape of state.db: task_history (task_id, status, started_at, completed_at, target_kind), workflow_runs
// (workflow_ref, status, created_at, completed_at), improve_runs (started_at, completed_at, ok) and index_completed events.
const DAY = 1440, SPAN = 14 * DAY, r = rng(5);
const START = new Date(2026, 9, 28).getTime(); // the left edge of the window; the right edge is "now"
const groups = [
  { label: "Scheduled tasks", rows: [
    { id: "sync-bundles", note: "every 30 minutes", every: 30, minutes: [0.3, 1.2], fail: 0.004 },
    { id: "extract-sessions", note: "every hour", every: 60, minutes: [1, 6], fail: 0.01 },
    { id: "improve-nightly", note: "daily at 02:00", every: DAY, offset: 120, minutes: [18, 40], fail: 0.05 },
    { id: "backup-stash", note: "daily at 03:15", every: DAY, offset: 195, minutes: [2, 4], fail: 0, failFrom: 9 * DAY },
    { id: "lint-library", note: "daily at 06:00", every: DAY, offset: 360, minutes: [3, 8], fail: 0.03 },
    { id: "weekly-digest", note: "Mondays at 09:00", every: 7 * DAY, offset: 5 * DAY + 540, minutes: [12, 20], fail: 0 },
  ] },
  { label: "Workflow runs", rows: [
    { id: "release-readiness", note: "started by an agent", manual: 5, minutes: [9, 16], fail: 0.2, activeNow: true },
    { id: "triage-incident", note: "started by an agent", manual: 8, minutes: [20, 90], fail: 0.05, blocked: 0.15 },
    { id: "weekly-digest", note: "started by a task", every: 7 * DAY, offset: 5 * DAY + 541, minutes: [11, 19], fail: 0 },
  ] },
  { label: "Improve", rows: [
    { id: "improve", note: "nightly and on demand", every: DAY, offset: 121, minutes: [17, 39], fail: 0.06, extra: 4 },
  ] },
  { label: "Index", rows: [
    { id: "index", note: "after writes and syncs", manual: 70, minutes: [0.2, 3], fail: 0 },
  ] },
];
// The machine was asleep over one weekend: nothing ran, which shows as a gap in every regular row.
const ASLEEP = [3 * DAY + 1100, 5 * DAY + 420];
const asleep = (t) => t > ASLEEP[0] && t < ASLEEP[1];
for (const group of groups) for (const row of group.rows) {
  row.runs = [];
  const add = (t, status) => {
    if (t < 0 || t > SPAN || asleep(t)) return;
    const minutes = row.minutes[0] + r() * r() * (row.minutes[1] - row.minutes[0]);
    const s = status ?? (row.failFrom && t >= row.failFrom ? "failed" : r() < row.fail ? "failed" : r() < (row.blocked ?? 0) ? "blocked" : "completed");
    row.runs.push({ start: t, end: t + (s === "failed" ? minutes * 0.4 : minutes), status: s, row });
  };
  if (row.every) for (let t = row.offset ?? 0; t < SPAN; t += row.every) add(t + r() * 0.5);
  for (let k = 0; k < (row.manual ?? row.extra ?? 0); k++) add(Math.floor(r() * 14) * DAY + 540 + r() * 540);
  if (row.activeNow) row.runs.push({ start: SPAN - 9.4, end: SPAN, status: "active", row });
  row.runs.sort((a, b) => a.start - b.start);
}
const allRuns = groups.flatMap((g) => g.rows.flatMap((row) => row.runs));
const when = (t) => new Date(START + t * 60000).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const took = (run) => { const m = run.end - run.start; return m < 1 ? `${Math.round(m * 60)} s` : m < 90 ? `${m.toFixed(m < 10 ? 1 : 0)} min` : `${(m / 60).toFixed(1)} h`; };
const WORD = { completed: "Completed", failed: "Failed", blocked: "Blocked", active: "Running now" };

const canvas = $("#c"), ctx = canvas.getContext("2d");
const LEFT = 236, RIGHT = 150, TOP = 34, ROW = 30, HEAD = 26;
let t0 = 0, t1 = SPAN, W = 0, H = 0, ink = {}, hover = null, selected = null, layout = [];
const x = (t) => LEFT + ((t - t0) / (t1 - t0)) * (W - LEFT - RIGHT);
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function draw() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.font = "12px ui-sans-serif, system-ui, sans-serif"; ctx.textBaseline = "middle";
  const right = W - RIGHT, span = t1 - t0;
  // Axis: days, and hours once a day is wide enough to hold them.
  const hours = span <= 2 * DAY ? 3 : span <= 4 * DAY ? 6 : 0;
  ctx.save(); ctx.beginPath(); ctx.rect(LEFT, 0, right - LEFT, H); ctx.clip();
  for (let d = Math.floor(t0 / DAY); d * DAY <= t1; d++) {
    const date = new Date(START + d * DAY * 60000);
    if (date.getDay() === 0 || date.getDay() === 6) { ctx.fillStyle = css(ink.surface2, 0.6); ctx.fillRect(x(d * DAY), TOP - 6, x((d + 1) * DAY) - x(d * DAY), H); }
    ctx.fillStyle = css(ink.border); ctx.fillRect(Math.round(x(d * DAY)), TOP - 6, 1, H);
    ctx.fillStyle = css(ink.muted); ctx.textAlign = "left";
    ctx.fillText(date.toLocaleDateString("en-US", span > 8 * DAY ? { weekday: "narrow", day: "numeric" } : { weekday: "short", month: "short", day: "numeric" }), x(d * DAY) + 4, 12);
    if (hours) for (let h = hours; h < 24; h += hours) {
      ctx.fillStyle = css(ink.border, 0.5); ctx.fillRect(Math.round(x(d * DAY + h * 60)), TOP - 6, 1, H);
      ctx.fillStyle = css(ink.muted, 0.8); ctx.fillText(`${String(h).padStart(2, "0")}:00`, x(d * DAY + h * 60) + 4, 24);
    }
  }
  ctx.restore();
  layout = [];
  let y = TOP;
  for (const group of groups) {
    ctx.fillStyle = css(ink.muted); ctx.textAlign = "left"; ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(group.label, 14, y + HEAD / 2 + 2);
    ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
    y += HEAD;
    for (const row of group.rows) {
      const mid = y + ROW / 2;
      ctx.fillStyle = css(ink.border); ctx.fillRect(0, y + ROW - 0.5, W, 1);
      ctx.fillStyle = css(ink.text); ctx.textAlign = "left"; ctx.fillText(row.id, 14, mid - 6);
      ctx.fillStyle = css(ink.muted); ctx.font = "11px ui-sans-serif, system-ui, sans-serif"; ctx.fillText(row.note, 14, mid + 8);
      // The row's figures for the visible range: runs and failures, as plain counts.
      const inView = row.runs.filter((run) => run.end >= t0 && run.start <= t1), failed = inView.filter((run) => run.status === "failed").length;
      ctx.textAlign = "right"; ctx.fillStyle = css(ink.muted); ctx.fillText(`${inView.length} runs`, W - 14, mid - 6);
      ctx.fillStyle = css(failed ? ink.fail : ink.muted); ctx.fillText(failed ? `${failed} failed` : "none failed", W - 14, mid + 8);
      ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
      ctx.save(); ctx.beginPath(); ctx.rect(LEFT, y, right - LEFT, ROW); ctx.clip();

function runAt(mx, my) {

canvas.addEventListener("pointerup", (e) => {

function select(run) {

        el("dt", {}, "Took"), el("dd", {}, took(run)), el("dt", {}, "Schedule"), el("dd", {}, run.row.note)),
      el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
        el("button", {}, group === "Workflow runs" ? "Open run trace" : group === "Scheduled tasks" ? "Open log" : "Open run"), el("button", { onclick: () => select(null) }, "Back to summary"))));

        el("li", {}, el("button", { onclick: () => jump(row.runs.at(-1)) }, row.id), el("span", { className: "muted xs" }, `last ${n} runs failed, since ${when(row.runs.at(-n).start)}`))) : [el("li", { className: "muted" }, "Nothing")]))),

        el("li", {}, el("button", { onclick: () => jump(run) }, `${run.row.id} · ${WORD[run.status].toLowerCase()}`), el("span", { className: "muted xs" }, when(run.start)))))),
