<script>
// Prototype helpers shared by the examples.
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
/** A seeded random source, so every load shows the same data. */
function rng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.int = (n) => Math.floor(next() * n);
  next.pick = (list) => list[Math.floor(next() * list.length)];
  next.gauss = () => (next() + next() + next() + next() - 2) * 0.87;
  return next;
}
/** The colour a design token resolves to in the scheme on screen, as [r, g, b] (the same probe chart-view.js uses). */
function tokenRGB(name) {
  const probe = el("span", { style: `position:absolute;visibility:hidden;color:var(${name})` });
  document.body.append(probe);
  const c = document.createElement("canvas").getContext("2d");
  c.fillStyle = getComputedStyle(probe).color;
  c.fillRect(0, 0, 1, 1);
  probe.remove();
  return [...c.getImageData(0, 0, 1, 1).data.slice(0, 3)];
}
const isDark = () => {
  const forced = document.documentElement.dataset.theme;
  return forced ? forced === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
/** The Appearance switch: Desktop stores this choice; here it only stamps data-theme. */
function themeToggle(button, onChange) {
  const apply = () => { button.textContent = isDark() ? "Light theme" : "Dark theme"; onChange?.(isDark()); };
  button.addEventListener("click", () => {
    document.documentElement.dataset.theme = isDark() ? "light" : "dark";
    apply();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
  apply();
}
const fmt = (n) => n.toLocaleString("en-US");
const ago = (days) => (days < 1 ? "today" : days < 2 ? "yesterday" : days < 60 ? `${Math.round(days)} days ago` : `${Math.round(days / 30)} months ago`);

// graph-gl.js: a WebGL2 point-and-line renderer for large graphs. No dependencies.
// In Desktop this file would be src/lib/ui/graph-gl.js, wrapped by a GraphView.svelte the way
// chart-view.js is wrapped by ActivityChart.svelte.
//
// createGraphView({ canvas, labels, data, dark }) -> view
//   data.count            number of nodes
//   data.pos              Float32Array(count * 3)
//   data.color            Uint8Array(count * 4)   rgba
//   data.size             Float32Array(count)     world-space radius
//   data.edges            Uint32Array(pairs)      node indices
//   data.anchors          [{ text, x, y, z }]     group labels (optional)
//   data.label(i)         string for a node label
// view.setColors(u8) / setState(u8: 0 dimmed, 1 normal, 2 emphasised) / setEdges(u32) / setHighlightEdges(u32)
// view.setPositions(f32) / setFlat(bool) / setDark(bool) / focus(i) / project(i) / destroy()
// view.onHover(i | -1) / view.onPick(i | -1) / view.onFrame(ms)
// view.particles: [{ from, to, t (0..1), color: [r,g,b] }] drawn each frame by the caller's own clock.

const POINT_VS = `#version 300 es
in vec3 aPos; in vec4 aColor; in float aSize; in float aState;
uniform mat4 uMVP; uniform float uPx, uFlat, uDim, uMinPx;
out vec4 vColor;
void main() {
  gl_Position = uMVP * vec4(aPos.x, aPos.y * uFlat, aPos.z, 1.0);
  float s = aSize * uPx / gl_Position.w;
  if (aState > 1.5) s = s * 1.5 + 3.0;
  gl_PointSize = clamp(s, uMinPx, 44.0);
  vColor = vec4(aColor.rgb, aColor.a * (aState < 0.5 ? uDim : 1.0));
}`;
const POINT_FS = `#version 300 es
precision mediump float;
in vec4 vColor; out vec4 o;
void main() {
  vec2 c = gl_PointCoord * 2.0 - 1.0;
  float d = dot(c, c);
  if (d > 1.0) discard;
  o = vec4(vColor.rgb, vColor.a * smoothstep(1.0, 0.6, d));
}`;
const LINE_VS = `#version 300 es
in vec3 aPos; in vec4 aColor; in float aState;
uniform mat4 uMVP; uniform float uFlat, uAlpha, uDim;
out vec4 vColor;
void main() {
  gl_Position = uMVP * vec4(aPos.x, aPos.y * uFlat, aPos.z, 1.0);
  vColor = vec4(aColor.rgb, uAlpha * (aState < 0.5 ? uDim : 1.0));
}`;
const LINE_FS = `#version 300 es
precision mediump float;
in vec4 vColor; out vec4 o;
void main() { o = vColor; }`;

function program(gl, vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  // One attribute layout for every program, so they share a vertex array.
  ["aPos", "aColor", "aSize", "aState"].forEach((name, i) => gl.bindAttribLocation(p, i, name));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(p, i).name;
    uniforms[name] = gl.getUniformLocation(p, name);
  }
  return { p, u: uniforms };
}

function createGraphView({ canvas, labels, data, dark = true }) {
  const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, powerPreference: "high-performance" });
  if (!gl) throw new Error("WebGL2 is not available");
  const ctx = labels.getContext("2d");
  const N = data.count;
  const points = program(gl, POINT_VS, POINT_FS);
  const lines = program(gl, LINE_VS, LINE_FS);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buffer = (index, array, size, type, normalized, usage = gl.STATIC_DRAW) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, array, usage);
    gl.enableVertexAttribArray(index);
    gl.vertexAttribPointer(index, size, type, normalized, 0, 0);
    return b;
  };
  const state = new Uint8Array(N).fill(1);
  const posBuf = buffer(0, data.pos, 3, gl.FLOAT, false, gl.DYNAMIC_DRAW);
  const colorBuf = buffer(1, data.color, 4, gl.UNSIGNED_BYTE, true, gl.DYNAMIC_DRAW);
  buffer(2, data.size, 1, gl.FLOAT, false);
  const stateBuf = buffer(3, state, 1, gl.UNSIGNED_BYTE, false, gl.DYNAMIC_DRAW);
  const edgeBuf = gl.createBuffer();
  const hiBuf = gl.createBuffer();
  let edgeCount = 0;
  let hiCount = 0;

  // Particles (activity pulses) and the emphasised nodes are drawn from small dynamic buffers of their own.
  const pvao = gl.createVertexArray();
  gl.bindVertexArray(pvao);
  const MAXP = 4096;
  const pPos = new Float32Array(MAXP * 3);
  const pCol = new Uint8Array(MAXP * 4);
  const pSize = new Float32Array(MAXP);
  const pState = new Uint8Array(MAXP).fill(1);
  const pPosBuf = buffer(0, pPos, 3, gl.FLOAT, false, gl.DYNAMIC_DRAW);
  const pColBuf = buffer(1, pCol, 4, gl.UNSIGNED_BYTE, true, gl.DYNAMIC_DRAW);
  const pSizeBuf = buffer(2, pSize, 1, gl.FLOAT, false, gl.DYNAMIC_DRAW);
  buffer(3, pState, 1, gl.UNSIGNED_BYTE, false);
  gl.bindVertexArray(null);

  const cam = { yaw: 0.6, pitch: 0.42, dist: 2150, tx: 0, ty: 0, tz: 0, flat: 1 };
  const goal = { ...cam };
  const mvp = new Float32Array(16);
  let W = 1, H = 1, dpr = 1, fov = 0.8, px = 1;
  let hover = -1, selected = -1, idleAt = 0, raf = 0, destroyed = false;
  let pointer = null;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const view = {
    particles: [],
    emphasis: [],
    autoRotate: !reduced,
    edgeScale: 1,
    onHover: () => {}, onPick: () => {}, onFrame: () => {},
    cam, goal,
    setColors(u8) { gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, u8); data.color = u8; },
    setPositions(f32) { data.pos = f32; gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, f32); },
    setState(u8) { state.set(u8); gl.bindBuffer(gl.ARRAY_BUFFER, stateBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, state); },
    state,
    setEdges(u32) {
      gl.bindVertexArray(null);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, edgeBuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, u32, gl.STATIC_DRAW);
      edgeCount = u32.length;
    },
    setHighlightEdges(u32) {
      gl.bindVertexArray(null);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, hiBuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, u32, gl.DYNAMIC_DRAW);
      hiCount = u32.length;
    },
    setFlat(flat) { goal.flat = flat ? 0 : 1; goal.pitch = flat ? Math.PI / 2 - 0.001 : 0.42; },
    setDark(value) { dark = value; },
    select(i) { selected = i; },
    focus(i, dist) {
      goal.tx = data.pos[i * 3]; goal.ty = data.pos[i * 3 + 1] * goal.flat; goal.tz = data.pos[i * 3 + 2];
      if (dist) goal.dist = Math.min(goal.dist, dist);
      idleAt = performance.now() + 6000;
    },
    home() { Object.assign(goal, { tx: 0, ty: 0, tz: 0, dist: 2150 }); },
    project,
    destroy() {
      destroyed = true;
      cancelAnimationFrame(raf);
      observer.disconnect();
      gl.getExtension("WEBGL_lose_context")?.loseContext();
    },
  };
  view.setEdges(data.edges);

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    for (const c of [canvas, labels]) { c.width = Math.max(1, W * dpr); c.height = Math.max(1, H * dpr); }
    gl.viewport(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const observer = new ResizeObserver(resize);
  observer.observe(canvas);
  resize();

  function updateMatrix() {
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch), cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    // The camera's basis: f looks from the eye to the target, r is right, u is up.
    const fx = -cp * sy, fy = -sp, fz = -cp * cy;
    const rx = cy, ry = 0, rz = -sy;
    const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
    const ex = cam.tx - fx * cam.dist, ey = cam.ty - fy * cam.dist, ez = cam.tz - fz * cam.dist;
    const f = 1 / Math.tan(fov / 2), aspect = W / H, near = 5, far = 20000;
    const a = (far + near) / (near - far), b = (2 * far * near) / (near - far);
    // mvp = projection * view, column-major.
    const v = [rx, ux, -fx, ry, uy, -fy, rz, uz, -fz, -(rx * ex + ry * ey + rz * ez), -(ux * ex + uy * ey + uz * ez), fx * ex + fy * ey + fz * ez];
    for (let c = 0; c < 4; c++) {
      const x = v[c * 3], y = v[c * 3 + 1], z = v[c * 3 + 2], w = c === 3 ? 1 : 0;
      mvp[c * 4] = (f / aspect) * x;
      mvp[c * 4 + 1] = f * y;
      mvp[c * 4 + 2] = a * z + b * w;
      mvp[c * 4 + 3] = -z;
    }
    px = (H * dpr * f) / 2;
  }

  /** Screen position of a node, or of a world point: [x, y, w, pointRadiusPx]. w <= 0 is behind the camera. */
  function project(i, out = [0, 0, 0, 0], x, y, z) {
    if (x === undefined) { x = data.pos[i * 3]; y = data.pos[i * 3 + 1]; z = data.pos[i * 3 + 2]; }
    y *= cam.flat;
    const w = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
    out[0] = ((mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12]) / w * 0.5 + 0.5) * W;
    out[1] = (1 - ((mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13]) / w * 0.5 + 0.5)) * H;
    out[2] = w;
    out[3] = i >= 0 ? Math.min(44, Math.max((data.size[i] * px) / w, 2 * dpr)) / dpr / 2 : 0;
    return out;
  }

  /** The node under the pointer: every node is projected on the CPU, which costs well under a millisecond at 30k. */
  function pick(mx, my) {
    const p = [0, 0, 0, 0];
    let best = -1, bestScore = Infinity;
    for (let i = 0; i < N; i++) {
      if (state[i] === 0) continue;
      project(i, p);
      if (p[2] <= 0) continue;
      const dx = p[0] - mx, dy = p[1] - my, r = p[3] + 4;
      const d = dx * dx + dy * dy;
      if (d < r * r) {
        const score = d / (r * r) + p[2] * 1e-5;
        if (score < bestScore) { bestScore = score; best = i; }
      }
    }
    return best;
  }

  // Pointer: drag orbits (or pans in flat mode / with shift or the right button), wheel and pinch zoom.
  const touches = new Map();
  let dragged = false, pinch = 0;
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    dragged = false;
    pinch = 0;
  });
  canvas.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer = [e.clientX - rect.left, e.clientY - rect.top];
    const last = touches.get(e.pointerId);
    if (!last) return;
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    idleAt = performance.now() + 6000;
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) goal.dist = Math.max(40, Math.min(8000, goal.dist * (pinch / d)));
      pinch = d;
      dragged = true;
      return;
    }
    if (Math.abs(dx) + Math.abs(dy) > 2) dragged = true;
    if (goal.flat === 0 || e.shiftKey || e.buttons === 2) {
      const k = (cam.dist * Math.tan(fov / 2) * 2) / H;
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), sp = Math.sin(cam.pitch);
      goal.tx -= (dx * cy + dy * sy * sp) * k;
      goal.tz -= (-dx * sy + dy * cy * sp) * k;
      Object.assign(cam, { tx: goal.tx, tz: goal.tz });
    } else {
      goal.yaw -= dx * 0.005;
      goal.pitch = Math.max(-1.4, Math.min(1.5, goal.pitch + dy * 0.005));
      Object.assign(cam, { yaw: goal.yaw, pitch: goal.pitch });
    }
  });
  const release = (e) => {
    if (touches.delete(e.pointerId) && !dragged && e.type === "pointerup") {
      const rect = canvas.getBoundingClientRect();
      updateMatrix();
      view.onPick(pick(e.clientX - rect.left, e.clientY - rect.top));
    }
  };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("pointerleave", () => { pointer = null; });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    goal.dist = Math.max(40, Math.min(8000, goal.dist * Math.exp(e.deltaY * 0.0012)));
    idleAt = performance.now() + 6000;
  }, { passive: false });
  // Keyboard: arrows orbit or pan, + and - zoom, so the map is usable without a pointer.
  canvas.tabIndex = 0;
  canvas.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 0.3 : 0.1;
    const pan = goal.flat === 0 ? goal.dist * 0.1 : 0;
    if (e.key === "ArrowLeft") pan ? (goal.tx -= pan) : (goal.yaw -= step);
    else if (e.key === "ArrowRight") pan ? (goal.tx += pan) : (goal.yaw += step);
    else if (e.key === "ArrowUp") pan ? (goal.tz -= pan) : (goal.pitch = Math.min(1.5, goal.pitch + step));
    else if (e.key === "ArrowDown") pan ? (goal.tz += pan) : (goal.pitch = Math.max(-1.4, goal.pitch - step));
    else if (e.key === "+" || e.key === "=") goal.dist = Math.max(40, goal.dist * 0.8);
    else if (e.key === "-") goal.dist = Math.min(6000, goal.dist * 1.25);
    else return;
    e.preventDefault();
    idleAt = performance.now() + 6000;
  });

  // The largest nodes first: labels are given to whichever of these are big enough on screen.
  const bySize = Array.from({ length: N }, (_, i) => i).sort((a, b) => data.size[b] - data.size[a]).slice(0, 3000);
  const ink = () => (dark ? "#ededf0" : "#0f0f14");
  const paper = () => (dark ? "rgba(10,10,12,.78)" : "rgba(246,246,249,.85)");

  function drawLabels() {
    ctx.clearRect(0, 0, W, H);
    ctx.textBaseline = "middle";
    const p = [0, 0, 0, 0];
    const taken = [];
    const place = (text, x, y, { bold = false, pill = false, color = ink() } = {}) => {
      ctx.font = `${bold ? "600 " : ""}${pill ? 11 : 12}px ui-sans-serif, system-ui, sans-serif`;
      const w = ctx.measureText(text).width + (pill ? 16 : 8);
      const box = [x, y - 10, x + w, y + 10];
      if (!bold && taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) return;
      taken.push(box);
      ctx.fillStyle = paper();
      ctx.beginPath(); ctx.roundRect(x, y - 9, w, 18, pill ? 9 : 2); ctx.fill();
      if (pill) { ctx.strokeStyle = color; ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.fillStyle = color;
      ctx.fillText(text, x + (pill ? 8 : 4), y + 0.5);
    };
    const ring = (i, color, grow = 3) => {
      project(i, p);
      if (p[2] <= 0) return false;
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], p[3] + grow, 0, 7); ctx.stroke();
      return true;
    };
    if (selected >= 0 && ring(selected, ink(), 5)) place(data.label(selected), p[0] + p[3] + 9, p[1], { bold: true });
    if (hover >= 0 && hover !== selected && ring(hover, ink())) place(data.label(hover), p[0] + p[3] + 7, p[1], { bold: true });
    for (const i of view.emphasis) {
      if (i === selected || i === hover) continue;
      project(i, p);
      if (p[2] > 0 && p[0] > 0 && p[0] < W && p[1] > 0 && p[1] < H) place(data.label(i), p[0] + p[3] + 5, p[1]);
      if (taken.length > 40) break;
    }
    // Group names while zoomed out; node names once nodes are large enough to read.
    const far = cam.dist > 1100;
    if (far) for (const a of data.anchors ?? []) {
      project(-1, p, a.x, a.y, a.z);
      if (p[2] > 0) place(a.text, p[0], p[1], { pill: true, color: a.color ?? ink() });
    }
    let shown = 0;
    if (!far && selected < 0) for (const i of bySize) {
      if (shown > 28) break;
      if (state[i] === 0 || i === selected || i === hover) continue;
      project(i, p);
      if (p[2] <= 0 || p[3] < 5.5 || p[0] < 0 || p[0] > W || p[1] < 0 || p[1] > H) continue;
      const before = taken.length;
      place(data.label(i), p[0] + p[3] + 4, p[1]);
      if (taken.length > before) shown++;
    }
  }

  let lastT = performance.now(), frameN = 0;
  function frame(t) {
    if (destroyed) return;
    const dt = Math.min(64, t - lastT); lastT = t;
    if (view.autoRotate && t > idleAt && !touches.size && goal.flat === 1) goal.yaw += dt * 0.00004;
    const k = 1 - Math.exp(-dt / 140);
    for (const key of ["yaw", "pitch", "dist", "tx", "ty", "tz", "flat"]) cam[key] += (goal[key] - cam[key]) * k;
    updateMatrix();
    if (pointer && !touches.size && frameN % 2 === 0) {
      const next = pick(pointer[0], pointer[1]);
      if (next !== hover) { hover = next; canvas.style.cursor = next >= 0 ? "pointer" : "grab"; view.onHover(next, pointer); }
    } else if (!pointer && hover !== -1) { hover = -1; view.onHover(-1); }

    const bg = dark ? [0.039, 0.039, 0.047] : [0.965, 0.965, 0.976];
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    // Lines are additive on a dark ground (overlaps glow) and plain alpha on a light one.
    gl.blendFunc(gl.SRC_ALPHA, dark ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vao);

    gl.useProgram(lines.p);
    gl.uniformMatrix4fv(lines.u.uMVP, false, mvp);
    gl.uniform1f(lines.u.uFlat, cam.flat);
    gl.uniform1f(lines.u.uDim, 0.12);
    // Fewer, fainter lines read better far away; the density rises as you zoom in.
    const zoom = Math.min(1, 500 / cam.dist);
    gl.uniform1f(lines.u.uAlpha, ((dark ? 0.075 : 0.09) + zoom * 0.12) * view.edgeScale);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, edgeBuf);
    gl.drawElements(gl.LINES, edgeCount, gl.UNSIGNED_INT, 0);
    if (hiCount) {
      gl.uniform1f(lines.u.uAlpha, 0.9);
      gl.uniform1f(lines.u.uDim, 1);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, hiBuf);
      gl.drawElements(gl.LINES, hiCount, gl.UNSIGNED_INT, 0);
    }

    // Nodes use plain alpha in both themes, so a dense cluster keeps its colours and does not burn out to white.
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(points.p);
    gl.uniformMatrix4fv(points.u.uMVP, false, mvp);
    gl.uniform1f(points.u.uPx, px);
    gl.uniform1f(points.u.uFlat, cam.flat);
    gl.uniform1f(points.u.uDim, dark ? 0.16 : 0.18);
    gl.uniform1f(points.u.uMinPx, 2.0 * dpr);
    gl.drawArrays(gl.POINTS, 0, N);

    // Pulses travelling along a link, drawn as a bright head on a straight path between two nodes.
    const count = Math.min(view.particles.length, MAXP);
    if (count) {
      for (let i = 0; i < count; i++) {
        const q = view.particles[i], a = q.from * 3, b = q.to * 3, s = q.t;
        const from = q.fromPos ?? data.pos.subarray(a, a + 3), to = data.pos.subarray(b, b + 3);
        pPos[i * 3] = from[0] + (to[0] - from[0]) * s;
        pPos[i * 3 + 1] = from[1] + (to[1] - from[1]) * s + Math.sin(s * Math.PI) * (q.arc ?? 0);
        pPos[i * 3 + 2] = from[2] + (to[2] - from[2]) * s;
        pCol.set(q.color, i * 4); pCol[i * 4 + 3] = 255;
        pSize[i] = q.size ?? 9;
      }
      gl.bindVertexArray(pvao);
      gl.bindBuffer(gl.ARRAY_BUFFER, pPosBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pPos, 0, count * 3);
      gl.bindBuffer(gl.ARRAY_BUFFER, pColBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pCol, 0, count * 4);
      gl.bindBuffer(gl.ARRAY_BUFFER, pSizeBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pSize, 0, count);
      gl.uniform1f(points.u.uMinPx, 5 * dpr);
      gl.drawArrays(gl.POINTS, 0, count);
    }
    gl.bindVertexArray(null);
    drawLabels();
    view.onFrame(dt, t);
    frameN++;
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  return view;
}

// Synthetic data in the shape akm stores. Nothing here is read from a real stash.
//   nodes  = rows of index.db `entries` (item_ref "<bundle>//<conceptId>", type, bundle_id)
//   edges  = rows of index.db `asset_links` (kind is one of the eight declared-link kinds)
//   use    = index.db `utility_scores` (show_count, search_count, last_used_at)
//   belief = IndexDocument.beliefState / supersededBy / contradictedBy

// Fifteen built-in asset types fold into eight colour families (env and secret are left off the map, as
// `assets.related` already leaves them out).
const FAMILIES = [
  { label: "Knowledge", types: ["knowledge"], share: 0.34 },
  { label: "Memories and facts", types: ["memory", "fact"], share: 0.3 },
  { label: "Skills", types: ["skill"], share: 0.06 },
  { label: "Lessons", types: ["lesson"], share: 0.07 },
  { label: "Commands and scripts", types: ["command", "script"], share: 0.08 },
  { label: "Workflows and tasks", types: ["workflow", "task"], share: 0.035 },
  { label: "Sessions", types: ["session"], share: 0.06 },
  { label: "Agents, instructions, rules", types: ["agent", "instruction", "rule"], share: 0.055 },
];
const TYPES = FAMILIES.flatMap((f, fi) => f.types.map((name) => ({ name, family: fi })));
const FOLDER = { knowledge: "knowledge", memory: "memories", fact: "facts", skill: "skills", lesson: "lessons", command: "commands",
  script: "scripts", workflow: "workflows", task: "tasks", session: "sessions", agent: "agents", instruction: "instructions", rule: "rules" };
const LINK_KINDS = [
  { kind: "links_to", label: "Link" }, { kind: "xref", label: "Cross-reference" }, { kind: "cites", label: "Citation" },
  { kind: "derived_from", label: "Derived from" }, { kind: "uses", label: "Uses" }, { kind: "belief_peer", label: "Related belief" },
  { kind: "superseded_by", label: "Superseded by" }, { kind: "contradicted_by", label: "Contradicted by" },
];
const BUNDLES = ["team-wiki", "memories", "eng-skills", "ops-runbooks", "product-docs", "agent-kit", "research", "personal"];
const DOMAINS = {
  platform: ["auth", "sessions", "rate-limits", "api-gateway", "webhooks", "feature-flags", "caching", "queues", "search-infra"],
  data: ["postgres", "migrations", "backups", "analytics", "etl", "warehouse", "schemas", "redis", "vector-store"],
  delivery: ["ci", "deploys", "releases", "rollbacks", "canaries", "docker", "kubernetes", "terraform", "secrets-mgmt"],
  quality: ["testing", "flaky-tests", "code-review", "linting", "type-safety", "perf", "profiling", "a11y", "security-review"],
  product: ["onboarding", "billing", "pricing", "invoices", "notifications", "email", "mobile", "design-system", "i18n"],
  ops: ["incidents", "on-call", "runbooks", "alerts", "dashboards", "logging", "tracing", "slo", "capacity"],
  people: ["team-norms", "hiring", "planning", "roadmap", "stakeholders", "customers", "vendors", "meetings", "decisions"],
  agents: ["prompts", "evals", "tool-use", "memory-hygiene", "harness-setup", "model-choice", "context-budget", "handoffs", "guardrails"],
};
const ASPECTS = ["overview", "setup", "troubleshooting", "checklist", "decision", "postmortem", "howto", "faq", "policy", "tuning", "rollout",
  "audit", "baseline", "gotchas", "playbook", "reference", "glossary", "review", "retry-policy", "timeouts", "ownership", "escalation",
  "limits", "naming", "template"];

function makeGraph(count = 30000, seed = 7) {
  const r = rng(seed);
  const domainNames = Object.keys(DOMAINS);
  const topics = [];
  domainNames.forEach((domain, di) => {
    const base = (di / domainNames.length) * Math.PI * 2;
    DOMAINS[domain].forEach((name, ti) => {
      const angle = base + (ti / 9 - 0.5) * 0.75 + r.gauss() * 0.05;
      const radius = 330 + ((ti * 5) % 9) * 105 + r.gauss() * 40;
      topics.push({ name, domain: di, x: Math.cos(angle) * radius, y: r.gauss() * 110, z: Math.sin(angle) * radius,
        spread: 55 + r() * 45, weight: 0.4 + r() * r() * 3, members: [] });
    });
  });
  const totalWeight = topics.reduce((sum, t) => sum + t.weight, 0);
  const familyOf = new Uint8Array(count), typeOf = new Uint8Array(count), bundleOf = new Uint8Array(count);
  const topicOf = new Uint16Array(count), shows = new Uint16Array(count), searches = new Uint16Array(count);
  const lastUsed = new Float32Array(count), belief = new Uint8Array(count), serial = new Uint16Array(count);
  const meaning = new Float32Array(count * 3), size = new Float32Array(count);

  const pickTopic = () => {
    let x = r() * totalWeight;
    for (let i = 0; i < topics.length; i++) if ((x -= topics[i].weight) <= 0) return i;
    return topics.length - 1;
  };
  const pickType = () => {
    let x = r(), fi = 0;
    while (fi < FAMILIES.length - 1 && (x -= FAMILIES[fi].share) > 0) fi++;
    const name = r.pick(FAMILIES[fi].types);
    return TYPES.findIndex((t) => t.name === name);
  };
  const bundleFor = (type, domain) => {
    const name = TYPES[type].name;
    if (["memory", "fact", "lesson", "session"].includes(name)) return r() < 0.82 ? 1 : 7;
    if (name !== "knowledge") return domain === 5 && r() < 0.4 ? 3 : r() < 0.7 ? 2 : 5;
    return domain === 5 ? 3 : domain === 4 || domain === 6 ? 4 : domain === 7 ? 6 : r() < 0.9 ? 0 : 6;
  };
  for (let i = 0; i < count; i++) {
    const ti = pickTopic(), topic = topics[ti], type = pickType();
    topicOf[i] = ti; typeOf[i] = type; familyOf[i] = TYPES[type].family; bundleOf[i] = bundleFor(type, topic.domain);
    serial[i] = topic.members.length;
    topic.members.push(i);
    meaning[i * 3] = topic.x + r.gauss() * topic.spread;
    meaning[i * 3 + 1] = topic.y + r.gauss() * topic.spread * 0.55;
    meaning[i * 3 + 2] = topic.z + r.gauss() * topic.spread;
    // Use is heavy-tailed: about four in ten assets were never shown, a few are shown constantly.
    const used = r() > 0.4;
    shows[i] = used ? Math.min(60000, Math.floor(Math.exp(r.gauss() * 1.5 + 1.1))) : 0;
    searches[i] = used ? Math.floor(shows[i] * (1.5 + r() * 3)) : r() < 0.3 ? r.int(4) : 0;
    lastUsed[i] = shows[i] ? Math.abs(r.gauss()) * 240 / (1 + Math.log2(1 + shows[i])) : Infinity;
    if (TYPES[type].family === 1) belief[i] = 1;
  }

  // Declared links. Each kind follows the rule declared-links.ts reads it from.
  const from = [], to = [], kind = [];
  const K = Object.fromEntries(LINK_KINDS.map((k, i) => [k.kind, i]));
  const link = (a, b, k) => { if (a !== b && b !== undefined) { from.push(a); to.push(b); kind.push(k); } };
  const near = (i, wantFamily) => {
    // A target in the same topic, or occasionally in a neighbouring topic of the same domain.
    let topic = topics[topicOf[i]];
    if (r() < 0.06) topic = topics[Math.min(topics.length - 1, Math.floor(topic.domain * 9 + r() * 9))];
    if (r() < 0.012) topic = r.pick(topics);
    for (let tries = 0; tries < 6; tries++) {
      const j = topic.members[r.int(topic.members.length)];
      if (j !== undefined && (wantFamily === undefined || wantFamily.includes(familyOf[j]))) return j;
    }
    return undefined;
  };
  for (const topic of topics) {
    // One or two index pages per topic: knowledge pages that link out to much of the topic.
    const pages = topic.members.filter((i) => familyOf[i] === 0).slice(0, 1 + (topic.members.length > 400 ? 1 : 0));
    for (const hub of pages) {
      shows[hub] = 400 + r.int(1800); searches[hub] = shows[hub] * 3; lastUsed[hub] = r() * 2;
      const n = Math.min(60, Math.floor(topic.members.length * 0.12));
      for (let k = 0; k < n; k++) link(hub, topic.members[r.int(topic.members.length)], K.links_to);
    }
  }
  for (let i = 0; i < count; i++) {
    const f = familyOf[i];
    if (f === 0) {
      for (let n = r.int(3); n > 0; n--) link(i, near(i, [0]), K.links_to);
      if (r() < 0.3) link(i, near(i, [0]), K.cites);
      if (r() < 0.15) link(i, near(i, [2, 4]), K.xref);
    } else if (f === 1) {
      if (r() < 0.3) link(i, near(i, [1]), K.derived_from);
      if (r() < 0.14) link(i, near(i, [1]), K.belief_peer);
      if (r() < 0.25) link(i, near(i, [0]), K.xref);
      if (r() < 0.06) { const j = near(i, [1]); if (j !== undefined) { link(i, j, K.superseded_by); belief[i] = 2; } }
      else if (r() < 0.025) { const j = near(i, [1]); if (j !== undefined) { link(i, j, K.contradicted_by); belief[i] = 3; } }
    } else if (f === 5) {
      for (let n = 1 + r.int(3); n > 0; n--) link(i, near(i, [4, 5, 2]), K.uses);
    } else if (f === 3) {
      if (r() < 0.6) link(i, near(i, [2, 0]), K.xref);
    } else if (f !== 6) {
      if (r() < 0.5) link(i, near(i, [0, 4]), K.xref);
    }
  }
  for (let i = 0; i < count; i++) size[i] = 2.6 + 1.5 * Math.log2(1 + shows[i] + searches[i] * 0.3);

  // The second layout, "by location": one disc per bundle, assets sorted by family then topic, so families form rings.
  const location = new Float32Array(count * 3);
  const byBundle = BUNDLES.map(() => []);
  for (let i = 0; i < count; i++) byBundle[bundleOf[i]].push(i);
  const spacing = 5.5 * Math.sqrt(30000 / count);
  const radii = byBundle.map((list) => spacing * Math.sqrt(list.length) + 30);
  // The largest bundle sits in the middle and the others share a ring around it, each given arc in proportion to its size.
  const order = BUNDLES.map((_, b) => b).sort((p, q) => radii[q] - radii[p]);
  const outer = order.slice(1), arc = outer.reduce((sum, b) => sum + radii[b], 0);
  const ring = Math.max(radii[order[0]] + radii[outer[0]] + 40, arc / Math.PI);
  let angle = -Math.PI / 2;
  const bundleAnchors = [];
  order.forEach((b, rank) => {
    const list = byBundle[b], half = rank ? (Math.PI * radii[b]) / arc : 0;
    angle += half;
    const cx = rank ? Math.cos(angle) * ring : 0, cz = rank ? Math.sin(angle) * ring : 0;
    angle += half;
    list.sort((p, q) => familyOf[p] - familyOf[q] || topicOf[p] - topicOf[q]);
    list.forEach((i, k) => {
      const rad = spacing * Math.sqrt(k + 0.5), th = k * 2.399963;
      location[i * 3] = cx + Math.cos(th) * rad; location[i * 3 + 1] = 0; location[i * 3 + 2] = cz + Math.sin(th) * rad;
    });
    bundleAnchors.push({ text: `${BUNDLES[b]} · ${fmt(list.length)}`, x: cx, y: 0, z: cz - radii[b] - 20 });
  });

  // Adjacency in compressed rows, both directions, for "what is this connected to".
  const E = from.length, degree = new Uint32Array(count + 1);
  for (let e = 0; e < E; e++) { degree[from[e] + 1]++; degree[to[e] + 1]++; }
  for (let i = 0; i < count; i++) degree[i + 1] += degree[i];
  const fill = degree.slice(0, count), adj = new Uint32Array(E * 2), adjEdge = new Uint32Array(E * 2);
  for (let e = 0; e < E; e++) {
    adj[fill[from[e]]] = to[e]; adjEdge[fill[from[e]]++] = e;
    adj[fill[to[e]]] = from[e]; adjEdge[fill[to[e]]++] = e;
  }
  const name = (i) => `${FOLDER[TYPES[typeOf[i]].name]}/${topics[topicOf[i]].name}/${ASPECTS[(i * 7 + serial[i]) % ASPECTS.length]}${serial[i] > 24 ? `-${serial[i]}` : ""}`;
  return {
    count, topics, familyOf, typeOf, bundleOf, topicOf, shows, searches, lastUsed, belief, size, meaning, location,
    from: Uint32Array.from(from), to: Uint32Array.from(to), kind: Uint8Array.from(kind),
    offsets: degree, adj, adjEdge,
    name, ref: (i) => `${BUNDLES[bundleOf[i]]}//${name(i)}`,
    topicAnchors: topics.map((t) => ({ text: t.name, x: t.x, y: t.y + t.spread * 1.2, z: t.z, weight: t.members.length })),
    bundleAnchors,
  };
}

/** Edge index pairs for the kinds that are switched on. */
function edgePairs(g, enabled) {
  const out = new Uint32Array(g.from.length * 2);
  let n = 0;
  for (let e = 0; e < g.from.length; e++) if (enabled[g.kind[e]]) { out[n++] = g.from[e]; out[n++] = g.to[e]; }
  return out.subarray(0, n);
}


const count = Number(new URLSearchParams(location.search).get("n")) || 30000;
$("#count").value = String(count);
$("#count").onchange = (e) => { location.search = `?n=${e.target.value}`; };

const g = makeGraph(count);
const ui = { colour: "family", layout: "meaning", lens: "", query: "", hiddenGroup: new Set(), kinds: LINK_KINDS.map(() => true), selected: -1 };
const colors = new Uint8Array(count * 4);
const pos = Float32Array.from(g.meaning);
const topAnchors = (list, n) => [...list].sort((a, b) => b.weight - a.weight).slice(0, n);
const data = { count, pos, color: colors, size: g.size, edges: edgePairs(g, ui.kinds), anchors: topAnchors(g.topicAnchors, 22), label: g.name };
const view = createGraphView({ canvas: $("#gl"), labels: $("#labels"), data, dark: isDark() });

// Colour: identity uses the eight categorical slots in a fixed order; use is one hue, light to dark.
const RAMP = { dark: [[16, 66, 129], [37, 106, 191], [85, 152, 231], [205, 226, 251]], light: [[183, 211, 246], [85, 152, 231], [37, 106, 191], [13, 54, 107]] };
const NEUTRAL = { dark: [86, 86, 98], light: [176, 176, 188] };
function ramp(t, dark) {
  const stops = RAMP[dark ? "dark" : "light"], x = Math.min(0.999, Math.max(0, t)) * (stops.length - 1), i = Math.floor(x), f = x - i;
  return stops[i].map((c, k) => c + (stops[i + 1][k] - c) * f);
}
function paint() {
  const dark = isDark(), slots = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => tokenRGB(`--c${n}`));
  const warn = tokenRGB("--warn"), fail = tokenRGB("--fail");
  for (let i = 0; i < count; i++) {
    let c;
    if (ui.lens === "belief" && g.belief[i] > 1) c = g.belief[i] === 3 ? fail : warn;
    else if (ui.colour === "family") c = slots[g.familyOf[i]];
    else if (ui.colour === "bundle") c = slots[g.bundleOf[i]];
    else c = g.shows[i] ? ramp(Math.log2(1 + g.shows[i]) / 11, dark) : NEUTRAL[dark ? "dark" : "light"];
    colors[i * 4] = c[0]; colors[i * 4 + 1] = c[1]; colors[i * 4 + 2] = c[2]; colors[i * 4 + 3] = dark ? 215 : 235;
  }
  view.setColors(colors);
  view.setDark(dark);
  legend();
}

// What is dimmed: a group switched off in the legend, anything outside the search, anything outside the highlight.
let matchCount = 0, bestMatch = -1;
function filter() {
  const state = new Uint8Array(count), q = ui.query.toLowerCase();
  matchCount = 0; bestMatch = -1;
  for (let i = 0; i < count; i++) {
    const group = ui.colour === "bundle" ? g.bundleOf[i] : g.familyOf[i];
    let on = ui.colour === "use" || !ui.hiddenGroup.has(group);
    if (on && ui.lens === "never") on = g.shows[i] === 0;
    if (on && ui.lens === "belief") on = g.belief[i] > 1;
    if (on && q) on = g.name(i).includes(q) || BUNDLES[g.bundleOf[i]].includes(q);
    if (on) { state[i] = q || ui.lens ? 2 : 1; matchCount++; if (bestMatch < 0 || g.shows[i] > g.shows[bestMatch]) bestMatch = i; }
  }
  if (ui.selected >= 0 && !q && !ui.lens) {
    // With an asset selected, only it and what it links to stay lit.
    state.fill(0);
    for (let a = g.offsets[ui.selected]; a < g.offsets[ui.selected + 1]; a++) if (ui.kinds[g.kind[g.adjEdge[a]]]) state[g.adj[a]] = 1;
  }
  if (ui.selected >= 0) state[ui.selected] = 2;
  view.setState(state);
  $("#matches").textContent = q || ui.lens ? `${fmt(matchCount)} of ${fmt(count)}` : "";
}

function legend() {
  const box = $("#legend");
  box.replaceChildren();
  if (ui.colour === "use") {
    $("#legendTitle").textContent = "Times shown to an agent";
    const dark = isDark(), stops = RAMP[dark ? "dark" : "light"].map((c) => `rgb(${c})`).join(",");
    const never = g.shows.reduce((n, v) => n + (v === 0), 0);
    box.append(
      el("div", { className: "ramp", style: `background:linear-gradient(90deg,${stops})` }),
      el("div", { className: "xs muted", style: "display:flex;justify-content:space-between" }, el("span", {}, "1"), el("span", {}, "30"), el("span", {}, "1,000+")),
      el("div", { className: "xs", style: "display:flex;gap:8px;align-items:center;margin-top:6px" },
        el("i", { className: "dot", style: `background:rgb(${NEUTRAL[dark ? "dark" : "light"]})` }), `Never shown · ${fmt(never)}`),
    );
    return;
  }
  const byBundle = ui.colour === "bundle";
  $("#legendTitle").textContent = byBundle ? "Bundle" : "Asset type";
  const names = byBundle ? BUNDLES : FAMILIES.map((f) => f.label);
  const totals = new Uint32Array(8);
  for (let i = 0; i < count; i++) totals[byBundle ? g.bundleOf[i] : g.familyOf[i]]++;
  names.forEach((name, k) => {
    const button = el("button", { title: "Show or hide" }, el("i", { style: `background:var(--c${k + 1})` }), name, el("span", { className: "n" }, fmt(totals[k])));
    button.setAttribute("aria-pressed", String(!ui.hiddenGroup.has(k)));
    button.onclick = (e) => {
      // Click toggles one group; Alt-click shows only that group.
      if (e.altKey) ui.hiddenGroup = new Set(names.map((_, j) => j).filter((j) => j !== k));
      else ui.hiddenGroup.has(k) ? ui.hiddenGroup.delete(k) : ui.hiddenGroup.add(k);
      legend(); filter();
    };
    box.append(button);
  });
  box.append(el("p", { className: "xs muted", style: "margin-top:6px" }, "Size is how often an asset is shown. Alt-click a row to show only that group."));
}

function kinds() {
  const totals = new Uint32Array(LINK_KINDS.length);
  for (const k of g.kind) totals[k]++;
  $("#kinds").replaceChildren(...LINK_KINDS.map((k, i) => {
    const box = el("input", { type: "checkbox", checked: ui.kinds[i] });
    box.onchange = () => { ui.kinds[i] = box.checked; const pairs = edgePairs(g, ui.kinds); view.setEdges(pairs); $("#sEdges").textContent = fmt(pairs.length / 2); select(ui.selected, false); };
    return el("label", {}, box, k.label, el("span", { className: "n" }, fmt(totals[i])));
  }));
  $("#sEdges").textContent = fmt(g.from.length);
}

function select(i, fly = true) {
  ui.selected = i;
  view.select(i);
  const box = $("#detail");
  if (i < 0) {
    view.setHighlightEdges(new Uint32Array(0)); view.emphasis = [];
    const top = Array.from({ length: count }, (_, k) => k).sort((a, b) => g.shows[b] - g.shows[a]).slice(0, 8);
    box.replaceChildren(el("h2", {}, "Most shown assets"), el("ul", { className: "list" }, ...top.map((k) =>
      el("li", {}, el("button", { onclick: () => select(k) }, g.name(k)), el("span", { className: "n muted xs num", style: "margin-left:auto" }, fmt(g.shows[k]))))),
      el("p", { className: "xs muted" }, "Click an asset on the map, or search, to see what it links to."));
    filter();
    return;
  }
  const pairs = [], groups = LINK_KINDS.map(() => []);
  for (let a = g.offsets[i]; a < g.offsets[i + 1]; a++) {
    const e = g.adjEdge[a];
    if (!ui.kinds[g.kind[e]]) continue;
    pairs.push(g.from[e], g.to[e]);
    groups[g.kind[e]].push({ node: g.adj[a], out: g.from[e] === i });
  }
  view.setHighlightEdges(Uint32Array.from(pairs));
  view.emphasis = [...new Set(pairs)].filter((n) => n !== i).sort((a, b) => g.size[b] - g.size[a]).slice(0, 14);
  if (fly) view.focus(i, 620);
  const type = TYPES[g.typeOf[i]].name, tone = g.belief[i] === 3 ? "fail" : g.belief[i] === 2 ? "warn" : "";
  box.replaceChildren(
    el("h2", { style: "overflow-wrap:anywhere" }, g.name(i).split("/").pop()),
    el("p", { className: "mono muted", style: "overflow-wrap:anywhere" }, g.ref(i)),
    el("div", { style: "display:flex;gap:6px;flex-wrap:wrap" },
      el("span", { className: "badge" }, el("i", { className: "dot", style: `background:var(--c${g.familyOf[i] + 1})` }), type),
      ...(tone ? [Object.assign(el("span", { className: "badge" }, g.belief[i] === 3 ? "Contradicted" : "Superseded"), { })].map((b) => (b.dataset.tone = tone, b)) : [])),
    el("dl", { className: "kv" },
      el("dt", {}, "Bundle"), el("dd", {}, BUNDLES[g.bundleOf[i]]),
      el("dt", {}, "Shown"), el("dd", { className: "num" }, `${fmt(g.shows[i])} times`),
      el("dt", {}, "In results"), el("dd", { className: "num" }, `${fmt(g.searches[i])} searches`),
      el("dt", {}, "Last used"), el("dd", {}, Number.isFinite(g.lastUsed[i]) ? ago(g.lastUsed[i]) : "never")),
    el("div", { style: "display:flex;gap:8px" }, el("button", {}, "Open in Library"), el("button", { onclick: () => select(-1) }, "Clear")),
    ...groups.flatMap((list, k) => !list.length ? [] : [
      el("h3", {}, `${LINK_KINDS[k].label} · ${list.length}`),
      el("ul", { className: "list" }, ...list.slice(0, 12).map(({ node, out }) => el("li", {},
        el("span", { className: "muted xs", title: out ? "This asset declares the link" : "The other asset declares the link" }, out ? "→" : "←"),
        el("button", { onclick: () => select(node) }, g.name(node))))),
      ...(list.length > 12 ? [el("p", { className: "xs muted" }, `and ${list.length - 12} more`)] : []),
    ]),
  );
  filter();
}

// Controls.
const seg = (id, apply) => $(id).addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  for (const b of $(id).children) b.setAttribute("aria-pressed", String(b === button));
  apply(button.dataset.v);
});
seg("#colour", (v) => { ui.colour = v; ui.hiddenGroup.clear(); paint(); filter(); });
seg("#dim", (v) => view.setFlat(v === "flat"));
seg("#layout", (v) => {
  // Move every asset to its place in the other arrangement, over about a second.
  const from = Float32Array.from(pos), to = v === "meaning" ? g.meaning : g.location, start = performance.now();
  data.anchors = v === "meaning" ? topAnchors(g.topicAnchors, 26) : g.bundleAnchors;
  view.home();
  view.goal.dist = v === "meaning" ? 2150 : 3300;
  const step = (now) => {
    const t = Math.min(1, (now - start) / 1100), k = t * t * (3 - 2 * t);
    for (let i = 0; i < pos.length; i++) pos[i] = from[i] + (to[i] - from[i]) * k;
    view.setPositions(pos);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});
$("#lens").onchange = (e) => { ui.lens = e.target.value; paint(); filter(); };
let typing;
$("#q").oninput = (e) => { clearTimeout(typing); typing = setTimeout(() => { ui.query = e.target.value.trim(); filter(); }, 120); };
$("#q").onkeydown = (e) => { if (e.key === "Enter" && bestMatch >= 0) select(bestMatch); };

const tip = $("#tip");
view.onHover = (i, at) => {
  tip.hidden = i < 0;
  if (i < 0) return;
  tip.replaceChildren(el("strong", {}, g.name(i)), el("div", { className: "muted xs" },
    `${TYPES[g.typeOf[i]].name} · ${BUNDLES[g.bundleOf[i]]} · shown ${fmt(g.shows[i])} times`));
  const stage = $("#stage").getBoundingClientRect();
  tip.style.left = `${Math.min(at[0] + 14, stage.width - 280)}px`;
  tip.style.top = `${Math.min(at[1] + 14, stage.height - 60)}px`;
};
view.onPick = (i) => select(i);
let acc = 0, frames = 0;
view.onFrame = (dt) => { acc += dt; if (++frames === 30) { $("#sFps").textContent = (acc / 30).toFixed(1); acc = frames = 0; } };

$("#sNodes").textContent = fmt(count);
themeToggle($("#theme"), paint);
kinds();
select(-1);
window.__view = view; window.__g = g; window.__select = select;
</script>
</body>
</html>
